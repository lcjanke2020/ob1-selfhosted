# Open Brain — ingress qube (three-qube split).
#
# Self-contained compose for the INGRESS (public-edge) qube — the qube that
# terminates the Tailscale Funnel. It runs:
#
#   caddy         — Reverse proxy / header-discriminated perimeter (Pattern Y).
#                   Single :9787 listener; reverse-proxies to the app qube's mcp
#                   through the host-side qubes.ConnectTCP forwarder
#                   (MCP_UPSTREAM = this qube's own IP:18787 — see
#                   ob1-mcp-forward.sh; the app qube has no network-facing
#                   mcp listener).
#   log-ingester  — Tails Caddy's JSON access logs and writes funnel_access_log
#                   rows to the LOCAL log sink over a unix socket, as the
#                   INSERT-only openbrain_ingester role.
#   log-sink      — This qube's own Postgres, holding the two Funnel-access
#                   relations and nothing else. Unix socket only: no published
#                   port, `network_mode: none`, `listen_addresses=` empty.
#
# What this qube does NOT run: mcp and ollama. They live on the app qube; this
# file simply doesn't define them, so the internet-adjacent edge never carries
# the app-role DB credential. (This is the clean end state of GH #13.)
#
# NO NETWORK PATH TO THE CORPUS. Earlier revisions kept exactly one: the
# ingester's INSERT-only connection ACROSS to the db qube on :5432, documented
# as a deliberate scoped exception (GH #12 option 2). The sink is option 3, and
# it removes the exception rather than justifying it — role grants are enforced
# INSIDE Postgres, above the layer a pre-auth wire-protocol or SCRAM-handshake
# flaw would live at, so while a socket was reachable from here a popped edge
# had a path toward the corpus regardless of how narrow its grants were.
# Enforcement now sits in dom0/qrexec policy, below anything this qube can
# reach.
#
# Credentials: this qube holds the INSERT-only ingester credential, the sink's
# init-only superuser, and the rollup role — all three for a LOCAL cluster
# whose entire contents are request metadata. It carries no credential of any
# kind for the corpus. Note the deliberate absence of anything named
# OPENBRAIN_APP_PASSWORD: the sink's rollup role is openbrain_logs_rollup
# precisely so no secret on this qube shares a name with an app-role secret.
#
# Run (from this directory, after copying .env.example to .env):
#   docker compose up -d
# Confirm all three services are present:  docker compose config --services
#   → must list exactly: caddy, log-ingester, log-sink

services:
  caddy:
    build:
      context: ../../compose-tailnet/caddy
      # Always pull the pinned base layer so a stale local cache can't feed an
      # older caddy into the perimeter image.
      pull: true
    restart: unless-stopped
    environment:
      # Reverse-proxy upstream. MANDATORY on this qube: there is no local `mcp`
      # service to fall back to, so an unset value would make Caddy proxy to a
      # nonexistent host and 502 every request. `:?` fails at `config` time
      # with this message. Set it to the ConnectTCP forwarder — this qube's own
      # IP:18787 (see .env.example + ob1-mcp-forward.sh). Kept in .env, never
      # the committed Caddyfile, so no deployment address is committed.
      MCP_UPSTREAM: ${MCP_UPSTREAM:?set MCP_UPSTREAM to the ConnectTCP forwarder, this qube's own IP:18787 (see .env.example)}
    # No `profiles` and no `depends_on: mcp`: on this qube Caddy is the always-on
    # entry point, and mcp is on a different qube (not a local service to gate on).
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
      - /config:size=16M
      - /data:size=16M
    security_opt:
      - no-new-privileges:true
    volumes:
      # `:Z` relabels the Caddyfile to container_file_t on SELinux hosts
      # (Fedora/Qubes); no-op elsewhere.
      - ../../compose-tailnet/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      # JSON access logs, shared (read-only) with the log-ingester.
      - caddy_logs:/var/log/caddy
    ports:
      - "127.0.0.1:9787:9787"
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -qO- http://127.0.0.1:9787/caddy-health || exit 1",
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Caddy access-log ingester → writes funnel_access_log rows to the LOCAL
  # log sink over a unix socket. It used to write ACROSS to the db qube on
  # :5432; removing that was the point of the change (this qube now has no
  # network path to the corpus at all).
  log-ingester:
    build:
      context: ../../../server
      dockerfile: Dockerfile.ingester
    restart: unless-stopped
    # Always-on here (no profile gate): this is the qube with Caddy logs to tail.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
    security_opt:
      - no-new-privileges:true
    # Only `lo`. The ingester's sole outbound need was the database, and that
    # is now a socket — so the process that parses attacker-controlled Caddy
    # JSON has no network stack to pivot through at all. Its Deno --allow-net
    # is itself narrowed to a single `unix:` socket path on this branch (no TCP
    # host); this is the second, coarser layer under it. See
    # server/Dockerfile.ingester's --allow-net note.
    network_mode: none
    # The database is now a sibling container, so a health gate is meaningful
    # (it was absent when Postgres lived on another qube). It NARROWS the
    # first-`up` race rather than closing it: pg_isready does not authenticate,
    # and the entrypoint's init-phase temp server answers on the same socket,
    # so the gate can release the ingester before the roles exist — it then
    # auth-fails and restart-loops briefly until init finishes, self-healing.
    # Steady-state startup ordering is what the gate actually buys.
    depends_on:
      log-sink:
        condition: service_healthy
    environment:
      # An ABSOLUTE PATH selects a unix socket directory instead of a TCP host
      # — dbHostType() in server/log_ingester.ts routes the driver to
      # `transport: "unix"`, and Dockerfile.ingester's ENTRYPOINT derives the
      # matching Deno permissions from the same leading-slash rule. This is the
      # CONTAINER-side path, so it is fixed; the host side is
      # LOG_SINK_SOCKET_DIR. `:?` keeps a blank value a config-time error.
      DB_HOST: ${INGESTER_DB_HOST:?set INGESTER_DB_HOST to /var/run/postgresql (the local log sink socket dir)}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${LOG_SINK_DB:-openbrain_logs}
      # INSERT-only observability role — still the only DB credential in this
      # qube's compose env, now for a local cluster rather than a remote one.
      # `:?` (not plain ${VAR}) so a blank value after `cp .env.example .env`
      # fails at `docker compose config` time, not as a runtime DB-auth error.
      DB_USER: openbrain_ingester
      DB_PASSWORD: ${OPENBRAIN_INGESTER_PASSWORD:?set OPENBRAIN_INGESTER_PASSWORD (the log-ingester INSERT-only role)}
      INGESTER_POLL_INTERVAL_MS: ${INGESTER_POLL_INTERVAL_MS:-5000}
      CADDY_LOG_DIR: /var/log/caddy
    volumes:
      # Read access logs RO so a compromised ingester can't tamper with the
      # on-disk audit evidence; cursors in a separate writable volume.
      - caddy_logs:/var/log/caddy:ro
      - caddy_cursors:/var/lib/ingester/cursors
      # The sink's socket directory, shared with log-sink. RW because
      # connecting to a unix socket needs write access to the socket file.
      # A shared SELinux label matches the sink's mount. Long syntax also
      # keeps the `:?` message unambiguous when tooling renders without
      # interpolation.
      - type: bind
        source: ${LOG_SINK_SOCKET_DIR:?set LOG_SINK_SOCKET_DIR to a SHORT host path, e.g. /home/user/ob1-log-sink/run}
        target: /var/run/postgresql
        bind:
          selinux: z

  # Local Funnel-log sink — this qube's own Postgres, reachable ONLY over a
  # unix socket. It replaces the INSERT path that used to cross to the db qube,
  # which is what lets this qube hold no network route to the corpus at all.
  #
  # NO `ports:` and NO network. `network_mode: none` gives the container just
  # `lo`, and `-c listen_addresses=` (empty) means Postgres opens no TCP socket
  # even there — so there is nothing to publish, nothing to firewall, and
  # nothing for a popped edge process to connect to except the socket below,
  # which still demands scram. Verify with `ss -tlnp` on the host (no 5432) and
  # `docker inspect` (networks: none).
  #
  # Contents: `funnel_access_log` + `funnel_access_summary` and nothing else —
  # see db/log-sink/01-log-sink.sql, whose companion assertion FAILS INIT if a
  # third relation or an unenumerated grant ever appears. No `thoughts`, no
  # `mcp_auth_events`, no pgvector; plain postgres keeps that extension's
  # supply chain off the internet-facing qube.
  #
  # The data is explicitly DISPOSABLE — 30-day raw, 365-day aggregate, no
  # backup. Losing it costs request metadata that was already this qube's to
  # lose; adding the perimeter to the backup pipeline would create a new data
  # path OUT of it, which is the opposite of the point.
  log-sink:
    # Image-only pin: bumping it also requires updating KNOWN_NON_DENO_IMAGES
    # in server/scripts/check_allow_env.ts (the allow-env drift gate).
    image: postgres:17-alpine
    restart: unless-stopped
    # Only `lo`. Belt to `listen_addresses=`'s braces: even a future edit that
    # re-enabled a TCP listener would have nothing to listen on.
    network_mode: none
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${LOG_SINK_DB:-openbrain_logs}
      POSTGRES_USER: ${LOG_SINK_SUPERUSER:-postgres}
      # Init-only credential. `:?` so a blank value fails at `docker compose
      # config` time — with local scram (below) a passwordless superuser can no
      # longer connect at all, so an empty value here bricks init rather than
      # silently opening a door.
      POSTGRES_PASSWORD: ${LOG_SINK_SUPERUSER_PASSWORD:?set LOG_SINK_SUPERUSER_PASSWORD (the log sink's init-only superuser)}
      # THE non-obvious one. The image's stock pg_hba is `local all all trust`,
      # which would let anything able to reach the socket connect as ANY role
      # — including the superuser — with no password, making the INSERT-only
      # ingester grant below purely decorative. --auth-local=scram-sha-256
      # makes initdb write a pg_hba that authenticates socket connections too.
      # docker-entrypoint.sh exports PGPASSWORD during the init phase
      # specifically so this works (see its comment at the temp-server start).
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      # There is no TCP listener, so `host` lines are unreachable by
      # construction; `reject` states the intent and fails closed if a future
      # edit ever re-opens one.
      POSTGRES_HOST_AUTH_METHOD: reject
      OPENBRAIN_INGESTER_PASSWORD: ${OPENBRAIN_INGESTER_PASSWORD:?set OPENBRAIN_INGESTER_PASSWORD (the log-ingester INSERT-only role)}
      OPENBRAIN_LOGS_ROLLUP_PASSWORD: ${OPENBRAIN_LOGS_ROLLUP_PASSWORD:?set OPENBRAIN_LOGS_ROLLUP_PASSWORD (the daily summary + retention role)}
      # Optional, like the monitor itself: unset means no monitor role and no
      # monitor grant. Plain ${VAR} (not `:?`) so a sink without the host-side
      # funnel monitor still comes up.
      OPENBRAIN_MONITOR_PASSWORD: ${OPENBRAIN_MONITOR_PASSWORD:-}
    # Socket only: an empty listen_addresses is a valid Postgres setting and
    # opens no TCP socket. (The init-phase temp server is socket-only
    # regardless — docker_temp_server_start appends its own
    # `-c listen_addresses=''` — so this flag governs the FINAL server, the one
    # that outlives init.)
    #
    # The checked-in wrapper still delegates to the image entrypoint, but first
    # refuses an existing PGDATA unless fresh init or assertion-gated adoption
    # wrote its completion marker. This keeps restart: unless-stopped from
    # turning a failed first init into a running partial schema. A healthy volume
    # created before the marker existed must first pass
    # scripts/adopt-log-sink-marker.sh while its old container is still running;
    # the wrapper never auto-adopts.
    entrypoint: ["/bin/sh", "/usr/local/bin/openbrain-log-sink-entrypoint.sh"]
    command: ["postgres", "-c", "listen_addresses="]
    volumes:
      - log_sink_data:/var/lib/postgresql/data
      # THE transport. A host directory, not a named volume, because the
      # host-side funnel monitor and daily rollup connect through it as well —
      # `psql -h <dir>` is libpq's own socket convention, so neither script
      # needs a special case. Ownership sorts itself out: the entrypoint chowns
      # this directory to the container's postgres user on every start
      # (docker-entrypoint.sh's `find /var/run/postgresql \! -user postgres`),
      # which under rootless docker lands on a subuid while leaving the
      # directory o+rx and the socket 0777 — so the host account can still
      # connect, and scram still decides who it is.
      #
      # `:z` relabels for SELinux (Fedora/Qubes hosts); shared, not private,
      # because the log-ingester mounts the same directory.
      #
      # KEEP THE PATH SHORT. A unix socket path is capped at 107 bytes
      # (sun_path), and it is the HOST path that counts for host-side clients.
      # A deep directory produces `Unix-domain socket path ... is too long`
      # at connect time, not at mount time.
      - type: bind
        source: ${LOG_SINK_SOCKET_DIR:?set LOG_SINK_SOCKET_DIR to a SHORT host path, e.g. /home/user/ob1-log-sink/run}
        target: /var/run/postgresql
        bind:
          selinux: z
      - ../../../db/log-sink/log-sink-entrypoint.sh:/usr/local/bin/openbrain-log-sink-entrypoint.sh:ro
      - ../../../db/log-sink/00-log-sink-roles.sh:/docker-entrypoint-initdb.d/00-log-sink-roles.sh:ro
      - ../../../db/log-sink/01-log-sink.sql:/docker-entrypoint-initdb.d/01-log-sink.sql:ro
      # Runs last so the invariants are checked against the finished schema,
      # while keeping its stable operator-facing source path.
      - ../../../db/log-sink/02-log-sink-assertion.sql:/docker-entrypoint-initdb.d/99-log-sink-assertion.sql:ro
      # Lexically after 99: if the assertion aborts, this marker is never made.
      - ../../../db/log-sink/03-log-sink-ready.sh:/docker-entrypoint-initdb.d/zz-log-sink-ready.sh:ro
    healthcheck:
      # -h is required: with no TCP listener, pg_isready's default host would
      # have nothing to probe.
      test: [
        "CMD-SHELL",
        "test -f \"$$PGDATA/.openbrain-log-sink-init-complete\" && pg_isready -h /var/run/postgresql -U ${LOG_SINK_SUPERUSER:-postgres} -d ${LOG_SINK_DB:-openbrain_logs}",
      ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_logs:
  caddy_cursors:
  log_sink_data:
