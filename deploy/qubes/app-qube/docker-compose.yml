# Open Brain — app qube (three-qube split).
#
# Self-contained compose for the APP qube in the three-qube Qubes topology
# (ingress / app / db — see ../three-qube-design.md). This file runs the
# application half ONLY:
#
#   mcp     — The Open Brain MCP server (Deno + Hono). Published on
#             127.0.0.1:8787 ONLY — the ingress qube's Caddy reaches it over a
#             dom0-policy-gated qubes.ConnectTCP channel, not a network
#             listener (see the note on the `ports` key below).
#             Connects to the canonical Postgres on the dedicated DB qube
#             through the host-side ob1-db-forward ConnectTCP forwarder
#             (DB_HOST in .env = this qube's own IP), writing thoughts as
#             the openbrain_app role.
#   ollama  — Embeddings, CPU-only (a Qubes app qube has no GPU passthrough).
#             Point OLLAMA_URL at an external GPU box to offload it.
#
# What this qube does NOT run: caddy, the log-ingester, and Postgres — those
# live on the ingress and db qubes respectively. This is a deliberate split:
# the file simply doesn't define them, so the app qube cannot start them.
#
# Credentials: this is the trusted compartment, so its .env holds the
# admin/superuser POSTGRES_PASSWORD — used to administer the db qube REMOTELY
# through this qube's ConnectTCP forwarder (role provisioning + schema/
# migrations); the db-qube pg_hba admits the superuser on loopback only,
# reachable solely through the channel dom0 policy grants to THIS qube
# (a deliberate trade-off; see ../db-qube/README.md)
# — plus the openbrain_app password (mcp writes thoughts) and the openbrain_readonly
# password (the encrypted backup job — see backup/). It never holds the
# log-ingester credential; that lives only on the ingress qube.
#
# Run (from this directory, after copying .env.example to .env):
#   docker compose up -d
#
# Network lockdown: mcp has NO network-facing listener. It publishes on
# loopback only; the ingress qube reaches it through a host-side forwarder +
# qubes.ConnectTCP, with dom0 policy gating the channel and mcp's OAuth door
# authenticating every request. See README.md § Ingress→app transport.
#
# The deployed posture runs this compose project under a ROOTLESS dockerd
# (the operator account's systemd --user daemon) — see the Qubes README
# § Rootless docker. The file itself is engine-agnostic.

services:
  mcp:
    build:
      context: ../../../server
    restart: unless-stopped
    # Defense-in-depth: mcp already runs as a non-root `deno` user (see
    # server/Dockerfile). Dropping all kernel capabilities and the rootfs
    # read-only trims the post-compromise blast radius. /tmp is writable
    # via tmpfs for any transient OS tempfile use (deno-postgres pool,
    # fetch keepalive, etc.). no-new-privileges:true prevents setuid
    # escalation even if a hypothetical setuid binary slips into the image.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    security_opt:
      - no-new-privileges:true
    # No `depends_on`: the database is on the dedicated db qube, not in this
    # compose project — there is no local postgres health-gate to wait on.
    # If the db qube is unreachable at boot, mcp exits with a clear `[db]`
    # error line and `restart: unless-stopped` retries until it is back
    # (see the boot probe wired in server/db.ts).
    environment:
      # The canonical Postgres lives on the dedicated DB qube, reached through
      # the host-side ConnectTCP forwarder on this qube's own IP. DB_HOST is
      # MANDATORY here (no `postgres` service to fall back to): `:?` makes
      # compose fail at `config` time with this message rather than failing
      # only at connect time against a nonexistent host.
      DB_HOST: ${DB_HOST:?set DB_HOST to this qube's own IP — the ob1-db-forward ConnectTCP forwarder (the three-qube split has no local postgres)}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-openbrain}
      DB_USER: openbrain_app
      # `:?` (not plain ${VAR}) so a blank value after `cp .env.example .env`
      # fails at `docker compose config` time, not as a runtime DB-auth error.
      DB_PASSWORD: ${OPENBRAIN_APP_PASSWORD:?set OPENBRAIN_APP_PASSWORD (the app role mcp connects as)}
      DB_POOL_SIZE: "10"
      # Boot-probe deadline; see server/config.ts DB_BOOT_PROBE_TIMEOUT_MS.
      DB_BOOT_PROBE_TIMEOUT_MS: ${DB_BOOT_PROBE_TIMEOUT_MS:-30000}
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:-default}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-768}
      CHAT_API_BASE: ${CHAT_API_BASE:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-15000}
      CHAT_TIMEOUT_MS: ${CHAT_TIMEOUT_MS:-60000}
      # Fallback chat endpoint — available only under an explicit alert/allow
      # policy, after the primary fails or as a fallback-only deployment.
      # Blank = disabled. NOTE: this path CAN send thought content off-box.
      FALLBACK_CHAT_API_BASE: ${FALLBACK_CHAT_API_BASE:-}
      FALLBACK_CHAT_API_KEY: ${FALLBACK_CHAT_API_KEY:-}
      FALLBACK_CHAT_MODEL: ${FALLBACK_CHAT_MODEL:-}
      # Required privacy choice. There is intentionally no compose or server
      # default; see .env.example for off / alert / allow semantics.
      METADATA_FALLBACK_POLICY: ${METADATA_FALLBACK_POLICY:?set METADATA_FALLBACK_POLICY to off, alert, or allow}
      # Optional server-side successor to the host log monitor. Event rows are
      # durable regardless; a non-empty channel list enables delivery.
      METADATA_NOTIFY_CHANNELS: ${METADATA_NOTIFY_CHANNELS:-}
      METADATA_NOTIFY_LABEL: ${METADATA_NOTIFY_LABEL:-OpenBrain}
      METADATA_NOTIFY_POLL_INTERVAL_MS: ${METADATA_NOTIFY_POLL_INTERVAL_MS:-300000}
      METADATA_NOTIFY_ROLLUP_MS: ${METADATA_NOTIFY_ROLLUP_MS:-1800000}
      METADATA_NOTIFY_TIMEOUT_MS: ${METADATA_NOTIFY_TIMEOUT_MS:-10000}
      METADATA_PUSHOVER_APP_TOKEN: ${METADATA_PUSHOVER_APP_TOKEN:-}
      METADATA_PUSHOVER_USER_KEY: ${METADATA_PUSHOVER_USER_KEY:-}
      METADATA_NTFY_SERVER_URL: ${METADATA_NTFY_SERVER_URL:-https://ntfy.sh}
      METADATA_NTFY_TOPIC: ${METADATA_NTFY_TOPIC:-}
      METADATA_NTFY_TOKEN: ${METADATA_NTFY_TOKEN:-}
      # Opt-in safety gate for the PRIMARY (CHAT_*) call. Off unless "true": when
      # off, extraction skips the primary and then follows the selected fallback
      # policy (or uses the uncategorized stub). Leave off until the primary
      # endpoint is verified reachable + safe.
      ENABLE_PRIMARY_EXTRACTION: ${ENABLE_PRIMARY_EXTRACTION:-}
      # OAuth-only deployment: pin native-token verification off and omit
      # MCP_ACCESS_KEY, so no x-brain-key can be used against this public install.
      ENABLE_NATIVE_TOKENS: "false"
      #
      # ENABLE_REST_API is DELIBERATELY not set here: the REST gateway
      # (/api/v1) is a docker-compose-install feature and this deployment's
      # posture is minimum-attack-surface — the MCP transport is the only
      # application surface it exposes. Unset means the router is never
      # mounted (server default is off). Do not add it.
      CITATION_BASE_URL: ${CITATION_BASE_URL:-https://openbrain.local/thoughts}
      # REQUIRED — the only auth door here. Compose fails fast if any is unset.
      AUTH0_ISSUER: ${AUTH0_ISSUER:?set AUTH0_ISSUER (Qubes deployment is OAuth-only)}
      AUTH0_JWKS_URI: ${AUTH0_JWKS_URI:?set AUTH0_JWKS_URI (Qubes deployment is OAuth-only)}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE (Qubes deployment is OAuth-only)}
      # REQUIRED in practice on this OAuth-only deployment: the in-app
      # authorization allowlist of exact JWT `sub` claims. FAIL-CLOSED —
      # left empty, the server boots but rejects EVERY Bearer token, so an
      # empty value here is a deliberate lockout, not a permissive default.
      # Compose deliberately does not `:?`-require it: the fail-closed
      # runtime posture (plus the boot-log warning) is the contract, and a
      # hard compose failure would block an operator intentionally sealing
      # the door during an incident.
      OAUTH_ALLOWED_SUBJECTS: ${OAUTH_ALLOWED_SUBJECTS:-}
      # Optional exact JWT subjects for non-Auth0 service-account attribution.
      # Auth0 client-credentials tokens are recognized from their signed gty.
      # Attribution only — a machine subject must ALSO be present in
      # OAUTH_ALLOWED_SUBJECTS above to be admitted.
      OAUTH_SERVICE_ACCOUNT_SUBJECTS: ${OAUTH_SERVICE_ACCOUNT_SUBJECTS:-}
      JWKS_FETCH_TIMEOUT_MS: ${JWKS_FETCH_TIMEOUT_MS:-10000}
      OBS_AUTH_EVENTS_ENABLED: ${OBS_AUTH_EVENTS_ENABLED:-true}
      OBS_AUTH_EVENTS_MAX_IN_FLIGHT: ${OBS_AUTH_EVENTS_MAX_IN_FLIGHT:-500}
      AUTH_BODY_READ_TIMEOUT_MS: ${AUTH_BODY_READ_TIMEOUT_MS:-2000}
      PORT: "8787"
    # Loopback-only publish: nothing listens on eth0 or the tailnet. The
    # ingress qube's Caddy reaches mcp over qubes.ConnectTCP — dom0 policy
    #   qubes.ConnectTCP +8787 <ingress-qube> <app-qube> allow autostart=no
    # gates the channel, and a socat forwarder on the ingress qube bridges
    # Caddy's MCP_UPSTREAM to the qrexec call (../ingress-qube/
    # ob1-mcp-forward.sh). qubes.ConnectTCP connects to 127.0.0.1:8787 on this
    # qube, which is exactly this publish. An earlier revision published
    # 0.0.0.0:8787 and scoped it with a Tailscale ACL grant + a DOCKER-USER
    # host-firewall rule; the qrexec transport removes that listener class
    # entirely — there is no wide bind left to scope, and no firewall state
    # that must be continuously right. mcp's OAuth door still authenticates
    # every request that arrives over the channel.
    ports:
      - "127.0.0.1:8787:8787"
    # To offload metadata classification to a GPU qube, reach the host-side
    # forwarder on :11434 at THIS QUBE'S OWN IP (`qubesdb-read /qubes-ip`):
    # under the deployed rootless docker a container reaches its own host via
    # slirp4netns, so set CHAT_API_BASE=http://<qube-ip>:11434/v1. (The old
    # compose-bridge-gateway bind is unreachable under rootless — the bridge
    # lives inside rootlesskit's netns.) See ../gpu-offload-transport.md.

  ollama:
    # Pinned to the version currently in production (0.24.0). Bump deliberately
    # when you're ready to re-test embeddings/chat output — `:latest` is a
    # supply-chain risk and a silent-upgrade footgun.
    # Image-only pin: bumping it also requires updating KNOWN_NON_DENO_IMAGES
    # in server/scripts/check_allow_env.ts (the allow-env drift gate).
    image: ollama/ollama:0.24.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # No GPU reservation: a Qubes app qube has no GPU passthrough, so CPU-only
    # nomic-embed-text (sub-second per request, fine for personal recall). To
    # offload embeddings to a GPU box, remove this service and point OLLAMA_URL
    # at it instead.

volumes:
  ollama_data:
