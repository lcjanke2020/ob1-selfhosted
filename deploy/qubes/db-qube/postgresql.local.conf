# Local Postgres settings for the DB qube.
#
# Apply as a drop-in (/etc/postgresql/<version>/main/conf.d/) or via ALTER SYSTEM
# (which persists in PGDATA/postgresql.auto.conf). Both are captured by the
# /var/lib/postgresql + /etc/postgresql bind-dirs and survive reboots.

# Loopback ONLY. The app qube — the only client — reaches this cluster over a
# dom0-policy-gated qubes.ConnectTCP channel whose target end connects to
# 127.0.0.1:5432 on this host (see app-qube/README.md § The app→db hop). No
# tailnet or LAN bind: with no network-facing listener there is nothing to
# firewall, and the boot-ordering constraint that came with binding the
# tailnet IP (wait for tailscale0 before starting the cluster) is gone — see
# rc.local.
listen_addresses = 'localhost'

# Disable server-side TLS: the only path to this cluster is loopback at both
# ends of a qrexec channel — dom0-mediated vchan, not a network link — so
# PG-level TLS is redundant here, and Debian's default snakeoil cert otherwise
# makes the client log a noisy "UnknownIssuer -> defaulting to non-encrypted
# connection" on every pool conn. Trade-off: this leans on the loopback-only
# assumption — if a non-loopback client is ever pointed at the cluster, turn
# ssl back on with a real (non-snakeoil) cert.
ssl = off
