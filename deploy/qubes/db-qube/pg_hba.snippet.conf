# pg_hba.conf snippet for the DB qube.
#
# Append to: /etc/postgresql/<version>/main/pg_hba.conf  (e.g. .../17/main/...)
#
# Appending is complete only for a FRESH install. An existing install also has
# lines to REMOVE — the two retired ingress-qube entries appended by earlier
# versions of this snippet, which appending the current file cannot take away.
# See README.md § Retiring the ingress qube's old access (existing installs).
#
# Each role is scoped to the qube that actually uses it, authenticated with
# scram-sha-256. This is the PG-layer gate that sits on top of the Tailscale ACL
# and the nft tailscale0:5432 rule.
#
# The superuser (`postgres`) is given a host line from the APP qube's IP ONLY, so
# the app qube can run remote DB administration (role provisioning + schema
# migrations) over the tailnet. This is a deliberate trade-off — a compromised
# app qube then has full DB admin (incl. COPY ... TO/FROM PROGRAM = command
# execution as the postgres OS user here, i.e. an app->db OS pivot), not just the
# app role — accepted for now because the app role already reads/writes every
# thought and this qube is highly contained; future work scopes admin down to a
# non-superuser migration role (GitHub #15). `DATABASE all` because CREATE DATABASE /
# CREATE ROLE connect to the `postgres` maintenance DB, not `openbrain`. Match the
# role name to POSTGRES_USER if you changed it from the `postgres` default.
#
# ONE peer in the three-qube split (replace the placeholder):
#   <app-qube-tailnet-ip>     — the APP qube. Holds the superuser (remote admin),
#                               the app role (mcp writes thoughts), and the
#                               readonly role (the encrypted backup job).
#
# THE INGRESS QUBE HAS NO LINE HERE, deliberately. It used to have two — an
# INSERT-only openbrain_ingester for the log-ingester and a SELECT-only
# openbrain_monitor for the host-side funnel monitor. Both now run against a
# local Funnel-log sink on the ingress qube itself
# (deploy/qubes/ingress-qube/README.md § Local log sink), so the internet-facing
# qube holds no credential for and no route to this database.
#
# Do not "helpfully" restore those lines when adding an ingress qube: a host
# line is only reachable behind the nft tailscale0 accept and the Tailscale ACL,
# and the point of the sink is that the edge needs neither. If you are running
# the SINGLE-app-qube on-ramp — log-ingester on the app qube, no separate
# ingress qube, no local sink — then add
#   host  openbrain  openbrain_ingester  <app-qube-tailnet-ip>/32  scram-sha-256
# and note that openbrain_ingester only exists when
# OPENBRAIN_INGESTER_PASSWORD is set (see db/00-roles.sh); a host line for a
# nonexistent role simply never matches.
#
# LOOPBACK LINES: none yet. When the app→db hop moves to qubes.ConnectTCP the
# connection arrives on 127.0.0.1 rather than the app qube's tailnet IP, so the
# lines below stop matching and are replaced by 127.0.0.1/32 equivalents. That
# also means pg_hba can no longer tell one caller from another — per-source
# enforcement moves to dom0 qrexec policy, which is per source qube. Not yet
# applied here; see the tracking issue in ../three-qube-design.md.
#
# TYPE  DATABASE     USER                 ADDRESS                        METHOD
host    all          postgres             <app-qube-tailnet-ip>/32        scram-sha-256   # superuser remote admin from the app qube
host    openbrain    openbrain_app        <app-qube-tailnet-ip>/32        scram-sha-256
host    openbrain    openbrain_readonly   <app-qube-tailnet-ip>/32        scram-sha-256
