# pg_hba.conf snippet for the DB qube.
#
# Append to: /etc/postgresql/<version>/main/pg_hba.conf  (e.g. .../17/main/...)
#
# Appending alone is NEVER complete — every install also has lines to REMOVE,
# which appending this file cannot take away:
#   - the stock broad loopback lines a normally initialized Debian cluster
#     ships (`host all all 127.0.0.1/32` + `host all all ::1/128`) — see
#     FIRST MATCH WINS below; this applies to FRESH installs too;
#   - on existing installs, the two retired ingress-qube entries appended by
#     the earliest versions of this snippet — README.md § Retiring the
#     ingress qube's old access;
#   - on existing installs, the three app-qube tailnet /32 host lines
#     appended by the previous version — README.md § Migrating an existing
#     install to ConnectTCP.
#
# FIRST MATCH WINS — the stock broad loopback lines MUST GO. PostgreSQL uses
# the first matching pg_hba record with no fall-through, and the stock file's
# `host all all` loopback entries sit ABOVE any append point. Left in place,
# they match every ConnectTCP-delivered connection first and the role/database
# scoping below never takes effect (any authenticating role could reach any
# database). Remove or comment both stock lines, then prove the ordering by
# attempt, not inspection — a syntax check cannot see it (pg_hba_file_rules
# reports no error either way):
#   psql -h 127.0.0.1 -U openbrain_app -d postgres -c 'select 1;'
# must FAIL with "no pg_hba.conf entry" (the app role has no line for the
# postgres maintenance DB), while the same command with -d openbrain
# authenticates.
#
# The app qube reaches this cluster over a dom0-policy-gated qubes.ConnectTCP
# channel (app-qube/README.md § The app→db hop), whose target end connects to
# this host's own loopback — the cluster has no network listener at all
# (listen_addresses = 'localhost', see postgresql.local.conf). That collapses
# what pg_hba can see: every remote caller arrives as 127.0.0.1, so per-source
# scoping is no longer pg_hba's job here. It moved DOWN a layer, to dom0
# qrexec policy, which is enforced per SOURCE QUBE — only the app qube has a
# ConnectTCP+5432 rule; no other qube can even open the channel. pg_hba keeps
# the role/database scoping and scram authentication on the lines below.
# The ::1 lines cover the ConnectTCP service resolving localhost to IPv6.
#
# The superuser (`postgres`) line exists so the app qube can run remote DB
# administration (role provisioning + schema migrations) through the channel.
# This is a deliberate trade-off — a compromised app qube then has full DB
# admin (incl. COPY ... TO/FROM PROGRAM = command execution as the postgres OS
# user here, i.e. an app->db OS pivot), not just the app role — accepted for
# now because the app role already reads/writes every thought and this qube is
# highly contained; future work scopes admin down to a non-superuser migration
# role (GitHub #15). `DATABASE all` because CREATE DATABASE / CREATE ROLE
# connect to the `postgres` maintenance DB, not `openbrain`. Match the role
# name to POSTGRES_USER if you changed it from the `postgres` default.
#
# THE INGRESS QUBE HAS NO LINE HERE, deliberately — and no qrexec rule either.
# It used to have two host lines from its tailnet IP (an INSERT-only
# openbrain_ingester and a SELECT-only openbrain_monitor). Both now run
# against a local Funnel-log sink on the ingress qube itself
# (deploy/qubes/ingress-qube/README.md § Local log sink), so the
# internet-facing qube holds no credential for and no route to this database.
# Do not "helpfully" restore them when adding an ingress qube. If you are
# running the SINGLE-app-qube on-ramp — log-ingester on the app qube, no
# separate ingress qube, no local sink — the ingester connects through the
# same app-qube channel: add
#   host  openbrain  openbrain_ingester  127.0.0.1/32  scram-sha-256
# and note that openbrain_ingester only exists when
# OPENBRAIN_INGESTER_PASSWORD is set (see db/00-roles.sh); a host line for a
# nonexistent role simply never matches.
#
# TYPE  DATABASE     USER                 ADDRESS         METHOD
host    all          postgres             127.0.0.1/32    scram-sha-256   # superuser remote admin, via the app qube's ConnectTCP channel
host    openbrain    openbrain_app        127.0.0.1/32    scram-sha-256
host    openbrain    openbrain_readonly   127.0.0.1/32    scram-sha-256
host    all          postgres             ::1/128         scram-sha-256
host    openbrain    openbrain_app        ::1/128         scram-sha-256
host    openbrain    openbrain_readonly   ::1/128         scram-sha-256
