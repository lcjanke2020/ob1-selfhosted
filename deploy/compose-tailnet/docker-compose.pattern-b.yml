# Pattern B override — drops the mcp host port mapping so the raw mcp port
# is unreachable from the host. Caddy (running under the `pattern-b` profile)
# is then the only entry point, reaching mcp over the docker network.
#
# Also brings up a dedicated socket-only log sink and the log-ingester sidecar
# that writes Caddy's structured request metadata into it. Funnel rows never
# enter the corpus Postgres. Both services are profile-gated with Caddy.
#
# Usage (with the profile flag):
#   docker compose --env-file .env --project-directory . \
#                  -f ../compose-local/docker-compose.yml \
#                  -f docker-compose.pattern-b.yml \
#                  --profile pattern-b up -d
#
# Or set these in .env, then run `docker compose --env-file .env up -d`:
#   COMPOSE_FILE=../compose-local/docker-compose.yml:docker-compose.pattern-b.yml
#   COMPOSE_PROFILES=pattern-b
# The explicit env-file flag prevents Compose from also loading
# ../compose-local/.env and filling keys that are absent here.
#
# Without this override, mcp's `127.0.0.1:8787:8787` host port stays published.
# A stray `tailscale funnel http://127.0.0.1:8787` then reaches mcp directly,
# bypassing the Caddy perimeter (IP allowlist, body cap, access logging).
#
# Requires the project's CI-certified Docker Compose floor, v2.38.2. The
# `!reset` tag itself is documented in v2.24.4, but that alone is not the full
# rendered-contract compatibility boundary.

services:
  mcp:
    ports: !reset null
    environment:
      # Enforce the OAuth-only posture at the deployment level, not just in
      # docs. The compose-local base inherits `MCP_ACCESS_KEY: ${MCP_ACCESS_KEY:-}`,
      # so an operator who copies a working local `.env` into this directory
      # (and forgets to blank the key) would otherwise leave the static
      # x-brain-key door open on a publicly-reachable box. Pinning it empty
      # here makes OAuth the only door, matching the Qubes app-qube compose,
      # which also omits the static-key variable. (An empty key sets ENABLE_BRAIN_KEY
      # false, so the server ignores any presented x-brain-key.)
      MCP_ACCESS_KEY: ""
      # Native x-brain-key tokens are also deliberately absent from the public
      # edge. Bearer OAuth remains the sole accepted credential class.
      ENABLE_NATIVE_TOKENS: "false"
      # The base compose may inherit a local single-user principal binding.
      # Clear it together with the key or config.ts correctly refuses the
      # otherwise-unused binding on this OAuth-only public deployment.
      MCP_ACCESS_KEY_PRINCIPAL: ""
      # Match the OAuth-only Qubes shape: fail during Compose rendering when
      # the only configured credential door lacks any verifier input. Waiting
      # for the server process to reject this at startup obscures the actual
      # deployment defect behind its restart policy.
      AUTH0_ISSUER: ${AUTH0_ISSUER:?set AUTH0_ISSUER (Pattern B is OAuth-only)}
      AUTH0_JWKS_URI: ${AUTH0_JWKS_URI:?set AUTH0_JWKS_URI (Pattern B is OAuth-only)}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?set AUTH0_AUDIENCE (Pattern B is OAuth-only)}

  # Caddy access log ingester.
  #
  # Tails /var/log/caddy/{funnel,tailnet}-access.log (shared volume with
  # caddy) and inserts structured rows into the dedicated log sink's
  # `funnel_access_log` table. See server/log_ingester.ts and db/log-sink/.
  #
  # Profile-gated identically to caddy — Pattern A has no Caddy and so no
  # logs to ingest. It reaches only the sink's unix socket and has no network
  # stack, so a parser compromise has no route toward the corpus service.
  log-ingester:
    build:
      context: ../../server
      dockerfile: Dockerfile.ingester
    restart: unless-stopped
    profiles:
      - pattern-b
    # Same defense-in-depth hardening as the mcp container — non-root user
    # comes from the Deno base image; no kernel caps needed for a pure
    # tail-and-insert loop. /tmp tmpfs is defensive (matches mcp).
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
    security_opt:
      - no-new-privileges:true
    network_mode: none
    depends_on:
      log-sink:
        condition: service_healthy
    environment:
      # An absolute path selects the unix transport in log_ingester.ts and in
      # the image's narrowed Deno --allow-net launcher. This is the fixed
      # container-side path; LOG_SINK_SOCKET_DIR is the host-side bind.
      DB_HOST: /var/run/postgresql
      DB_PORT: 5432
      DB_NAME: ${LOG_SINK_DB:-openbrain_logs}
      # Sink-only role with INSERT-only on funnel_access_log. `:?` so a blank
      # value after
      # `cp .env.example .env` fails at `docker compose config` time, not as a
      # runtime DB-auth error. See db/log-sink/00-log-sink-roles.sh.
      DB_USER: openbrain_ingester
      DB_PASSWORD: ${OPENBRAIN_INGESTER_PASSWORD:?set OPENBRAIN_INGESTER_PASSWORD (the log-ingester INSERT-only role) in .env for Pattern B}
      # Default 5s polling cadence is fine for personal traffic; bump via
      # .env if the box ever gets slammed and the loop runs into the next
      # poll window before finishing.
      INGESTER_POLL_INTERVAL_MS: ${INGESTER_POLL_INTERVAL_MS:-5000}
      CADDY_LOG_DIR: /var/log/caddy
    volumes:
      # Read the access log files from caddy_logs (RO so a compromised
      # ingester can't tamper with the on-disk audit evidence)
      # . Cursor companions live in a separate writable volume
      # mounted at a non-nested path: nesting `caddy_cursors` inside
      # the RO `caddy_logs` mount fails at container init because the
      # ingester has `read_only: true` rootfs and Docker can't create
      # the nested mountpoint dir on it. /var/lib/ingester is a fresh
      # path that the ingester image pre-creates as part of the build.
      - caddy_logs:/var/log/caddy:ro
      - caddy_cursors:/var/lib/ingester/cursors
      # Connecting to a unix socket needs write access to the socket node.
      # Shared SELinux label because log-sink mounts the same host directory.
      # Long syntax also keeps the `:?` message unambiguous when tooling asks
      # Compose to render the model without interpolation.
      - type: bind
        source: ${LOG_SINK_SOCKET_DIR:?set LOG_SINK_SOCKET_DIR to a short absolute host path}
        target: /var/run/postgresql
        bind:
          create_host_path: true
          selinux: z

  # Funnel request-metadata cluster. It has only the two db/log-sink relations,
  # no corpus schema or credential, no network, and no TCP listener even on lo.
  log-sink:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles:
      - pattern-b
    network_mode: none
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${LOG_SINK_DB:-openbrain_logs}
      POSTGRES_USER: ${LOG_SINK_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${LOG_SINK_SUPERUSER_PASSWORD:?set LOG_SINK_SUPERUSER_PASSWORD (the log sink's init-only superuser)}
      # Stock local trust would erase the role boundary for every process that
      # can reach the shared socket. Require SCRAM on unix sockets as well.
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: reject
      OPENBRAIN_INGESTER_PASSWORD: ${OPENBRAIN_INGESTER_PASSWORD:?set OPENBRAIN_INGESTER_PASSWORD (the log-ingester INSERT-only role)}
      OPENBRAIN_LOGS_ROLLUP_PASSWORD: ${OPENBRAIN_LOGS_ROLLUP_PASSWORD:?set OPENBRAIN_LOGS_ROLLUP_PASSWORD (the sink summary/retention role)}
      OPENBRAIN_MONITOR_PASSWORD: ${OPENBRAIN_MONITOR_PASSWORD:-}
    # Refuse an existing PGDATA unless fresh init or assertion-gated adoption
    # wrote its completion marker; restart must not bless a failed first init.
    # The Qubes pre-marker upgrade uses scripts/adopt-log-sink-marker.sh before
    # recreate; the wrapper itself never auto-adopts an unmarked directory.
    entrypoint: ["/bin/sh", "/usr/local/bin/openbrain-log-sink-entrypoint.sh"]
    command: ["postgres", "-c", "listen_addresses="]
    volumes:
      - log_sink_data:/var/lib/postgresql/data
      - type: bind
        source: ${LOG_SINK_SOCKET_DIR:?set LOG_SINK_SOCKET_DIR to a short absolute host path}
        target: /var/run/postgresql
        bind:
          create_host_path: true
          selinux: z
      - ../../db/log-sink/log-sink-entrypoint.sh:/usr/local/bin/openbrain-log-sink-entrypoint.sh:ro
      - ../../db/log-sink/00-log-sink-roles.sh:/docker-entrypoint-initdb.d/00-log-sink-roles.sh:ro
      - ../../db/log-sink/01-log-sink.sql:/docker-entrypoint-initdb.d/01-log-sink.sql:ro
      - ../../db/log-sink/02-log-sink-status-class.sql:/docker-entrypoint-initdb.d/02-log-sink-status-class.sql:ro
      - ../../db/log-sink/02-log-sink-assertion.sql:/docker-entrypoint-initdb.d/99-log-sink-assertion.sql:ro
      - ../../db/log-sink/03-log-sink-ready.sh:/docker-entrypoint-initdb.d/zz-log-sink-ready.sh:ro
    healthcheck:
      test: [
        "CMD-SHELL",
        "test -f \"$$PGDATA/.openbrain-log-sink-init-complete\" && pg_isready -h /var/run/postgresql -U ${LOG_SINK_SUPERUSER:-postgres} -d ${LOG_SINK_DB:-openbrain_logs}",
      ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  log_sink_data:
