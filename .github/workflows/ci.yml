# CI for the MCP server: the unit test suite plus the --allow-env drift
# guard (check_allow_env.ts), so a new Deno.env.get key can't ship without
# the matching bounded Dockerfile or Compose-launcher entry — that drift is
# a silent boot failure in production (the process exits with "Requires env
# access" only after deploy).
#
# Scoped via the paths filter so this workflow runs for server code,
# checked-in Compose launchers, or this workflow file itself. Self-triggering
# on workflow edits means changes here (Deno version bump, ref-expression
# tweak, etc.) get exercised on the PR that introduces them.
#
# Deno version pinned to match server/Dockerfile (FROM denoland/deno:2.9.4)
# so the CI runtime matches what ships.
# The allow-env job also uses the runner's Docker Compose installation as the
# parser and merge oracle for every supported checked-in stack.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "server/**"
      - "deploy/**/docker-compose*.yml"
      - "deploy/**/docker-compose*.yaml"
      - "deploy/**/compose*.yml"
      - "deploy/**/compose*.yaml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/**/docker-compose*.yml"
      - "deploy/**/docker-compose*.yaml"
      - "deploy/**/compose*.yml"
      - "deploy/**/compose*.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Server unit tests
    runs-on: ubuntu-latest
    steps:
      # For PR events, use the GitHub-synced `refs/pull/<N>/head` mirror
      # rather than the PR head SHA directly: fork-PR head SHAs aren't in
      # the base repo and `actions/checkout` would fail to fetch them.
      # Falls back to `github.sha` for push and workflow_dispatch.
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Run unit tests
        working-directory: server
        run: deno task test

  check-allow-env:
    name: Deno launcher --allow-env drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Report Docker Compose version
        run: docker compose version

      - name: Run check-allow-env
        working-directory: server
        run: deno task check-allow-env

  image-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 1

      # `deno task test` runs from the source tree and can't see Dockerfile
      # layer-ordering mistakes: the import map references local modules
      # (postgres_deferred_patched.ts), and `deno install --frozen` runs in
      # an early COPY layer — if a referenced local file isn't in that
      # layer, only an actual image build fails. Build both images (no
      # push, no run) so copy-order drift is a PR failure, not a deploy
      # failure.
      - name: Build mcp image
        run: docker build -f server/Dockerfile server/

      - name: Build ingester image
        run: docker build -f server/Dockerfile.ingester server/
