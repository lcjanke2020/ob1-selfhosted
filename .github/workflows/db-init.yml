# Backup-recoverability smoke tests for the database init scripts and encrypted
# app-qube backup publisher.
#
# The off-box backup runs `pg_dump` as the trusted SELECT-only
# `openbrain_readonly` role (BYPASSRLS is required for pg_dump under forced
# RLS; the grants assertion rejects it on the app role). pg_dump reads every
# sequence's state (`SELECT last_value, is_called FROM <seq>`), so the role
# needs SELECT on all sequences, not just tables — a privilege that's easy to
# forget when a new serial/identity column lands. That is exactly what silently
# broke the nightly backup once the sessions PK became an identity column.
#
# The same completed init is also the integration fixture for the corpus
# breakout invariant. The assertion is mounted last, then deliberately re-run
# after sink-only roles, Funnel relations, and stale/unprovable pg_hba rules are
# introduced; each old-shape fixture must fail closed.
#
# Rather than enumerate privileges in a static assertion (which lags the next
# new object type and cannot see an object created later by another superuser),
# the corpus job exercises the real init path on a throwaway pgvector container
# and performs the actual full pg_dump operation. The independent log-sink job
# likewise runs the real socket-only init, adoption, role, assertion, rollup,
# retention, concurrency, and wrapper contracts.
#
# Both implementations live in scripts/ci/ so every coherent family is runnable
# outside Actions. This workflow owns checkout/runtime setup, the shared push/PR
# path contract, and runner invocation. The anchored path list keeps both event
# types on exactly one source of truth.

name: DB init smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: &db-init-paths
      - "db/**"
      - "server/session_queries.ts"
      - "server/queries.ts"
      - "server/metadata_notifications.ts"
      - "server/metadata_notifications_db_smoke.ts"
      - "server/access_tokens.ts"
      - "server/auth_context.ts"
      - "server/access_tokens_db_smoke.ts"
      - "server/auth_audit_db_smoke.ts"
      - "server/auth_audit_upgrade_db_smoke.ts"
      - "server/auth_middleware_audit_db_smoke.ts"
      - "server/auth.ts"
      - "server/inet.ts"
      - "server/db_boot_probe.ts"
      - "server/auth_audit.ts"
      - "server/session_search_db_smoke.ts"
      - "server/session_ordering_db_smoke.ts"
      - "server/thought_mutations_db_smoke.ts"
      - "server/scoped_db.ts"
      - "server/scope_contract.ts"
      - "server/db_pool.ts"
      - "server/embeddings.ts"
      - "server/config.ts"
      - "server/session_toml.ts"
      - "server/postgres_deferred_patched.ts"
      - "server/log_ingester.ts"
      - "server/deno.json"
      - "server/deno.lock"
      - "deploy/compose-local/docker-compose.yml"
      - "deploy/compose-tailnet/README.md"
      - "deploy/compose-tailnet/docker-compose.pattern-b.yml"
      - "deploy/qubes/app-qube/backup/**"
      - "deploy/qubes/app-qube/rc.local"
      - "deploy/qubes/ingress-qube/.env.example"
      - "deploy/qubes/ingress-qube/README.md"
      - "deploy/qubes/ingress-qube/docker-compose.yml"
      - "deploy/qubes/ingress-qube/openbrain-log-sink-dump*.sh"
      - "deploy/qubes/ingress-qube/rc.local"
      - "docs/security-model.md"
      - "scripts/check_pattern_b_compose.nu"
      - "scripts/adopt-log-sink-marker.sh"
      - "scripts/funnel_daily_summary.sh"
      - "scripts/funnel_monitor.sh"
      - "scripts/funnel_monitor_test.sh"
      - "deploy/qubes/ingress-qube/funnel-monitor.env.example"
      - "deploy/qubes/ingress-qube/funnel-monitor.service"
      - "deploy/qubes/ingress-qube/funnel-monitor.timer"
      - "deploy/qubes/ingress-qube/funnel-summary.env.example"
      - "deploy/qubes/ingress-qube/funnel-summary.service"
      - "deploy/qubes/ingress-qube/funnel-summary.timer"
      - "deploy/qubes/app-qube/auth-events-summary.env.example"
      - "deploy/qubes/app-qube/auth-events-summary.service"
      - "deploy/qubes/app-qube/auth-events-summary.timer"
      - "scripts/ci/**"
      - ".github/workflows/db-init.yml"
  push:
    branches: [main]
    paths: *db-init-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-pg-dump:
    name: readonly role can pg_dump
    runs-on: ubuntu-latest
    steps:
      # Pin PR execution to the immutable head SHA that triggered this run.
      # Trusted push/manual runs use their event SHA in the separate step below.
      - name: Checkout PR head safely
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted event ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Run corpus DB-init smoke families from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          env \
            GITHUB_WORKSPACE="$RUNNER_TEMP/ignored-workspace" \
            DB_SMOKE_HOST=192.0.2.1 \
            bash "${{ github.workspace }}/scripts/ci/run_db_init_smokes.sh" all

  log-sink-init:
    name: log sink init, invariants, and rollup
    runs-on: ubuntu-latest
    steps:
      # Pin PR execution to the immutable head SHA that triggered this run.
      # Trusted push/manual runs use their event SHA in the separate step below.
      - name: Checkout PR head safely
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted event ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Run log-sink smoke families from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          env \
            GITHUB_WORKSPACE="$RUNNER_TEMP/ignored-workspace" \
            POSTGRES_DB=ignored_database \
            POSTGRES_PASSWORD=ignored_password \
            PG_IMAGE=ignored_image \
            LOG_SINK_CONTAINER=ignored_container \
            COMPOSE_PROJECT_NAME=openbrain-ingress \
            COMPOSE_FILE="$RUNNER_TEMP/ignored-compose.yml" \
            bash "${{ github.workspace }}/scripts/ci/run_log_sink_smokes.sh" all
