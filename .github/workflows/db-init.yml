# Backup-recoverability smoke tests for the database init scripts and encrypted
# app-qube backup publisher.
#
# The off-box backup runs `pg_dump` as the trusted SELECT-only
# `openbrain_readonly` role (BYPASSRLS is required for pg_dump under forced
# RLS; the grants assertion rejects it on the app role). pg_dump reads every
# sequence's state (`SELECT last_value, is_called
# FROM <seq>`), so the role needs SELECT on all sequences, not just tables —
# a privilege that's easy to forget when a new serial/identity column lands.
# That is exactly what silently broke the nightly backup once the sessions PK
# became an identity column.
#
# The same completed init is also the integration fixture for the edge monitor
# allowlist. The assertion is mounted last, then deliberately re-run after
# unsafe token-admin role flags, an application-role membership, direct monitor
# table/sequence grants, a standing default grant, and a PUBLIC grant on a new
# non-public-schema table; each drift must fail without changing the assertion's
# allowlist.
#
# Rather than enumerate privileges in a static assertion (which lags the next
# new object type, and can't see an object created later by a different
# superuser), this job exercises the REAL init path on a throwaway pgvector
# container — the same db/*.sql files, in the order the postgres entrypoint
# runs them — and then performs the actual operation the backup performs: a
# full `pg_dump -U openbrain_readonly`. If the read-only role can't dump any
# object, the job fails. This catches this class of regression generically.
#
# Scoped to db/**, the session-HNSW production smoke and query path,
# deploy/compose-local/docker-compose.yml (the Postgres image pin it reads —
# see "Derive Postgres image" below), and this file — so it runs when the
# schema/grants, filtered-session search, the pinned image, or the test itself
# change.

name: DB init smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "db/**"
      - "server/session_queries.ts"
      - "server/queries.ts"
      - "server/metadata_notifications.ts"
      - "server/metadata_notifications_db_smoke.ts"
      - "server/access_tokens.ts"
      - "server/auth_context.ts"
      - "server/access_tokens_db_smoke.ts"
      - "server/session_search_db_smoke.ts"
      - "server/scoped_db.ts"
      - "server/scope_contract.ts"
      - "server/db_pool.ts"
      - "server/embeddings.ts"
      - "server/config.ts"
      - "server/session_toml.ts"
      - "server/postgres_deferred_patched.ts"
      - "server/deno.json"
      - "server/deno.lock"
      - "deploy/compose-local/docker-compose.yml"
      - "deploy/qubes/app-qube/backup/**"
      - "deploy/qubes/ingress-qube/docker-compose.yml"
      - "scripts/funnel_daily_summary.sh"
      - "scripts/funnel_monitor.sh"
      - "scripts/funnel_monitor_test.sh"
      - "deploy/qubes/ingress-qube/funnel-monitor.env.example"
      - "deploy/qubes/ingress-qube/funnel-monitor.service"
      - "deploy/qubes/ingress-qube/funnel-monitor.timer"
      - "deploy/qubes/ingress-qube/funnel-summary.env.example"
      - "deploy/qubes/ingress-qube/funnel-summary.service"
      - "deploy/qubes/ingress-qube/funnel-summary.timer"
      - "deploy/qubes/app-qube/funnel-summary.env.example"
      - "deploy/qubes/app-qube/funnel-summary.service"
      - "deploy/qubes/app-qube/funnel-summary.timer"
      - ".github/workflows/db-init.yml"
  push:
    branches: [main]
    paths:
      - "db/**"
      - "server/session_queries.ts"
      - "server/queries.ts"
      - "server/metadata_notifications.ts"
      - "server/metadata_notifications_db_smoke.ts"
      - "server/access_tokens.ts"
      - "server/auth_context.ts"
      - "server/access_tokens_db_smoke.ts"
      - "server/session_search_db_smoke.ts"
      - "server/scoped_db.ts"
      - "server/scope_contract.ts"
      - "server/db_pool.ts"
      - "server/embeddings.ts"
      - "server/config.ts"
      - "server/session_toml.ts"
      - "server/postgres_deferred_patched.ts"
      - "server/deno.json"
      - "server/deno.lock"
      - "deploy/compose-local/docker-compose.yml"
      - "deploy/qubes/app-qube/backup/**"
      - "deploy/qubes/ingress-qube/docker-compose.yml"
      - "scripts/funnel_monitor.sh"
      - "scripts/funnel_monitor_test.sh"
      - "scripts/funnel_daily_summary.sh"
      - "deploy/qubes/ingress-qube/funnel-monitor.env.example"
      - "deploy/qubes/ingress-qube/funnel-monitor.service"
      - "deploy/qubes/ingress-qube/funnel-monitor.timer"
      - "deploy/qubes/ingress-qube/funnel-summary.env.example"
      - "deploy/qubes/ingress-qube/funnel-summary.service"
      - "deploy/qubes/ingress-qube/funnel-summary.timer"
      - "deploy/qubes/app-qube/funnel-summary.env.example"
      - "deploy/qubes/app-qube/funnel-summary.service"
      - "deploy/qubes/app-qube/funnel-summary.timer"
      - ".github/workflows/db-init.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-pg-dump:
    name: readonly role can pg_dump
    runs-on: ubuntu-latest
    env:
      # PG_IMAGE is derived from compose at runtime (see the step below) so it
      # can't drift from the deployed stack's Postgres pin.
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
      # CI-only throwaway credentials for an ephemeral container — not secrets.
      POSTGRES_PASSWORD: ci_superuser_pw
      OPENBRAIN_APP_PASSWORD: ci_app_pw
      OPENBRAIN_READONLY_PASSWORD: ci_readonly_pw
      # Set so the Pattern B ingester role + its conditional grants in
      # 02-observability.sql are exercised too (the fuller init path).
      OPENBRAIN_INGESTER_PASSWORD: ci_ingester_pw
      # Same for the optional SELECT-only funnel-monitor role (and the
      # monitor assertions in 03-grants-assertion.sql).
      OPENBRAIN_MONITOR_PASSWORD: ci_monitor_pw
      # Dedicated create/list/revoke role for the native-token smoke.
      OPENBRAIN_TOKEN_ADMIN_PASSWORD: ci_token_admin_pw
    steps:
      # Same fork-safe ref pattern as ci.yml.
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Smoke test — funnel monitor cursor, dedupe, and secret handling
        run: bash scripts/funnel_monitor_test.sh

      - name: Smoke test — encrypted backups never clobber
        run: bash deploy/qubes/app-qube/backup/ob1-db-backup_test.sh

      - name: Derive Postgres image from compose-local (single source of truth)
        run: |
          # Read the pinned pgvector image from compose so this test always
          # exercises the same Postgres version the deployed stack uses — no
          # second pin to drift. `-m1` returns the first match (no `head`, so no
          # SIGPIPE), and `|| true` keeps a no-match from tripping
          # `set -eo pipefail` before the guard below can emit a clear error.
          img=$(grep -m1 -oE 'pgvector/pgvector:[A-Za-z0-9._-]+' deploy/compose-local/docker-compose.yml || true)
          test -n "$img" || { echo "::error::no pgvector image found in deploy/compose-local/docker-compose.yml"; exit 1; }
          echo "PG_IMAGE=$img" >> "$GITHUB_ENV"
          echo "Using $img (from deploy/compose-local/docker-compose.yml)"

      - name: Start Postgres + pgvector with the repo init scripts
        run: |
          # Mount the init files individually (not the whole db/ dir) so the
          # ops-only summarize_funnel.sql never runs as init — mirrors compose.
          docker run -d --name pgci \
            -p 127.0.0.1:55439:5432 \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -e OPENBRAIN_APP_PASSWORD -e OPENBRAIN_READONLY_PASSWORD \
            -e OPENBRAIN_INGESTER_PASSWORD -e OPENBRAIN_MONITOR_PASSWORD \
            -e OPENBRAIN_TOKEN_ADMIN_PASSWORD \
            -v "$GITHUB_WORKSPACE/db/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro" \
            -v "$GITHUB_WORKSPACE/db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/02-observability.sql:/docker-entrypoint-initdb.d/02-observability.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/04-sessions.sql:/docker-entrypoint-initdb.d/04-sessions.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/05-hybrid-search.sql:/docker-entrypoint-initdb.d/05-hybrid-search.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/06-spaces.sql:/docker-entrypoint-initdb.d/06-spaces.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/07-metadata-degradation.sql:/docker-entrypoint-initdb.d/07-metadata-degradation.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/08-access-tokens.sql:/docker-entrypoint-initdb.d/08-access-tokens.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/03-grants-assertion.sql:/docker-entrypoint-initdb.d/99-grants-assertion.sql:ro" \
            "$PG_IMAGE"

      - name: Wait for init to finish (TCP ready == initdb.d complete)
        run: |
          # The entrypoint runs initdb.d against a local socket and only opens
          # TCP after every script succeeds, so TCP-ready doubles as "init
          # done". If an init script errors, the container exits — surface its
          # logs and fail loudly instead of timing out silently.
          for i in $(seq 1 60); do
            if docker exec pgci pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; ready=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' pgci 2>/dev/null)" != "true" ]; then
              echo "::error::postgres container exited during init"; docker logs pgci; exit 1
            fi
            sleep 1
          done
          if [ "${ready:-}" != "1" ]; then
            echo "::error::timed out waiting for postgres init"; docker logs pgci; exit 1
          fi

      - name: Sanity-check init applied (sessions + spaces + audit present)
        run: |
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM information_schema.schemata WHERE schema_name='sessions'" | grep -q 1
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM memory_scope.workspace WHERE id='sensitive' AND personal_only" | grep -q 1
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT to_regclass('public.metadata_degradation_outbox') IS NOT NULL" | grep -q t
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM metadata_degradation_notification_state WHERE singleton" | grep -q 1
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT to_regclass('native_auth.access_token') IS NOT NULL" | grep -q t

      - name: Smoke test — native token lifecycle is hash-only and least-privilege
        run: |
          # Reapply the migration to pin the existing-database/idempotency path,
          # re-check catalog grants, then exercise register/list/revoke through
          # the real dedicated and application roles inside a rollback.
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/08-access-tokens.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/03-grants-assertion.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/access-tokens-smoke.sql >/dev/null
          deno run --config server/deno.json --frozen \
            --allow-env \
            --allow-net=127.0.0.1:55439 \
            server/access_tokens_db_smoke.ts
          echo "native token registration, driver hashing, redacted listing, one-way revocation, and grants passed"

      - name: Smoke test — protected roles reject grant drift
        run: |
          run_assertion() {
            docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
              psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 < db/03-grants-assertion.sql
          }
          expect_rejected() {
            local label=$1
            local expected=$2
            local diagnostic=${3:-}
            local output
            if output=$(run_assertion 2>&1); then
              echo "::error::$label did not fail the protected-role grants assertion"
              return 1
            fi
            if ! grep -Fq "$expected" <<< "$output"; then
              echo "::error::$label failed without identifying $expected"
              echo "$output"
              return 1
            fi
            if [[ -n "$diagnostic" ]] && ! grep -Fq "$diagnostic" <<< "$output"; then
              echo "::error::$label failed without diagnostic marker $diagnostic"
              echo "$output"
              return 1
            fi
          }

          # The completed clean schema is valid, including relations created
          # after 02-observability.sql.
          run_assertion >/dev/null

          # An existing deployment may contain a pre-created or drifted role.
          # The migration must preserve LOGIN while removing every unsafe
          # cluster-level privilege flag, and the assertion must reject drift
          # before that reconciliation happens.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE openbrain_token_admin CREATEDB CREATEROLE REPLICATION"
          expect_rejected "token-admin privilege flags" \
            "openbrain_token_admin has unsafe cluster-level role attributes" \
            "CREATEDB, CREATEROLE, REPLICATION"
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/08-access-tokens.sql >/dev/null
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolcanlogin AND NOT (
               rolsuper OR rolcreatedb OR rolcreaterole OR
               rolreplication OR rolbypassrls
             )
             FROM pg_roles WHERE rolname = 'openbrain_token_admin'" | grep -q t
          run_assertion >/dev/null

          # Direct flags are not the only way to reach BYPASSRLS: membership
          # would also confer inherited privileges and allow SET ROLE.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "GRANT openbrain_readonly TO openbrain_app"
          expect_rejected "app role membership" \
            "openbrain_app is a member of" "openbrain_readonly"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "REVOKE openbrain_readonly FROM openbrain_app"

          # Existing relation, direct role grant, schema outside public.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "GRANT SELECT ON sessions.session TO openbrain_monitor"
          expect_rejected "direct monitor grant" "sessions.session"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "REVOKE SELECT ON sessions.session FROM openbrain_monitor"

          # Sequence relations are in scope too.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "GRANT USAGE ON SEQUENCE public.funnel_access_log_id_seq TO openbrain_monitor"
          expect_rejected "direct monitor sequence grant" "public.funnel_access_log_id_seq"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "REVOKE USAGE ON SEQUENCE public.funnel_access_log_id_seq FROM openbrain_monitor"

          # A default ACL is drift before any relation exists. Catch the
          # standing instruction instead of waiting for a future CREATE TABLE.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "CREATE SCHEMA monitor_assertion_probe;
             ALTER DEFAULT PRIVILEGES IN SCHEMA monitor_assertion_probe
               GRANT SELECT ON TABLES TO openbrain_monitor"
          expect_rejected "future-table default grant" "schema monitor_assertion_probe"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "ALTER DEFAULT PRIVILEGES IN SCHEMA monitor_assertion_probe
               REVOKE SELECT ON TABLES FROM openbrain_monitor"

          # A future table and a PUBLIC grant must be caught generically. Put
          # it in another schema to cover schema-qualified catalog scanning.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE monitor_assertion_probe.future_table (id integer);
             GRANT USAGE ON SCHEMA monitor_assertion_probe TO PUBLIC;
             GRANT SELECT ON monitor_assertion_probe.future_table TO PUBLIC"
          expect_rejected "future-table PUBLIC grant" \
            "monitor_assertion_probe.future_table" "(via PUBLIC)"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "REVOKE SELECT ON monitor_assertion_probe.future_table FROM PUBLIC;
             REVOKE USAGE ON SCHEMA monitor_assertion_probe FROM PUBLIC;
             DROP SCHEMA monitor_assertion_probe CASCADE"

          run_assertion >/dev/null
          echo "protected-role assertions accepted the clean catalog and rejected all six drift fixtures"

      - name: Smoke test — metadata audit is append-only and coherent
        run: |
          # Recreate the first preview's committed schema/data, apply current
          # migration 07 over it, and prove that columns, constraints, queued
          # history, and grants converge before cleaning the fixture.
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/metadata-degradation-legacy-fixture.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/07-metadata-degradation.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/03-grants-assertion.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/metadata-degradation-upgrade-smoke.sql >/dev/null

          # Reapply once more to pin idempotency, then use the real app role.
          # The SQL fixture rolls back outbox consumption and ledger updates.
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/07-metadata-degradation.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/metadata-degradation-smoke.sql >/dev/null
          deno run --config server/deno.json --frozen \
            --allow-env \
            --allow-net=127.0.0.1:55439 \
            server/metadata_notifications_db_smoke.ts
          echo "metadata preview upgrade, audit/outbox, immutable-history, shape, and ledger checks passed"

      - name: Smoke test — spaces isolate every audience and pooled reuse
        run: |
          # Reapply the upgrade migration first: init scripts do not rerun on
          # live volumes, so its documented idempotent upgrade path matters.
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/06-spaces.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/spaces-smoke.sql >/dev/null
          echo "spaces RLS, sensitive ownership, dedupe, artifacts, and GUC reuse passed"

      - name: Smoke test — session HNSW survives audience and residual filters
        env:
          DB_SMOKE_REBUILDS: "1"
        run: |
          # Calls the checked-out production searchSessions function as the
          # forced-RLS app role. The smoke separately forces and plan-checks
          # an exact reference, then verifies commit/rollback GUC restoration
          # and repeats after rebuilding the approximate index.
          deno run --config server/deno.json --frozen \
            --allow-env \
            --allow-net=127.0.0.1:55439 \
            server/session_search_db_smoke.ts

      - name: Smoke test — openbrain_readonly can run a full pg_dump
        run: |
          # The exact operation the off-box backup performs. Exits non-zero
          # with "permission denied for sequence/relation" if the read-only
          # role is missing SELECT on any dumped object. Run inside the
          # container so pg_dump's version matches the server's.
          docker exec -e PGPASSWORD="$OPENBRAIN_READONLY_PASSWORD" pgci \
            pg_dump -h 127.0.0.1 -U openbrain_readonly -d "$POSTGRES_DB" \
            --no-owner --no-privileges > /dev/null
          echo "pg_dump as openbrain_readonly succeeded"

      - name: Smoke test — monitor role runs its real probes, cannot read thoughts
        run: |
          # The two queries scripts/funnel_monitor.sh actually runs, as the
          # role it runs them with. Catches a grant regression the same way
          # the pg_dump step does for the backup path. The second query pins
          # the stateful public-door 401 scan (bounded by a row-id cutoff).
          docker exec -e PGPASSWORD="$OPENBRAIN_MONITOR_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_monitor -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT COUNT(*) FROM funnel_access_log WHERE socket='funnel' AND ts > now() - interval '5 minutes';" >/dev/null
          docker exec -e PGPASSWORD="$OPENBRAIN_MONITOR_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_monitor -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "WITH bounds AS MATERIALIZED (
               SELECT COALESCE(MAX(id), 0)::bigint AS max_id,
                      FLOOR(EXTRACT(EPOCH FROM now()))::bigint AS cutoff_epoch
               FROM funnel_access_log
             )
             SELECT max_id || '|' || cutoff_epoch || '|' ||
                    (SELECT COUNT(*) FROM funnel_access_log AS event
                     WHERE event.id <= bounds.max_id
                       AND event.socket = 'funnel'
                       AND event.status = 401
                       AND event.ts > now() - interval '5 minutes')
             FROM bounds;" >/dev/null
          # The v4 monitor is intentionally one-table. A replay of
          # 02-observability.sql must remove the obsolete v3 auth-event grant.
          if docker exec -e PGPASSWORD="$OPENBRAIN_MONITOR_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_monitor -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM mcp_auth_events LIMIT 1" >/dev/null 2>&1; then
            echo "::error::openbrain_monitor can read mcp_auth_events — SELECT should be denied"
            exit 1
          fi
          # Negative check: the edge-resident credential must NOT reach
          # thought content (03-grants-assertion.sql asserts this in the
          # catalog; this exercises it end-to-end).
          if docker exec -e PGPASSWORD="$OPENBRAIN_MONITOR_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_monitor -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM public.thoughts LIMIT 1" >/dev/null 2>&1; then
            echo "::error::openbrain_monitor can read public.thoughts — SELECT should be denied"
            exit 1
          fi
          if docker exec -e PGPASSWORD="$OPENBRAIN_MONITOR_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_monitor -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM memory_scope.workspace LIMIT 1" >/dev/null 2>&1; then
            echo "::error::openbrain_monitor can read the memory_scope registry"
            exit 1
          fi
          if docker exec -e PGPASSWORD="$OPENBRAIN_MONITOR_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_monitor -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT memory_scope.audience_matches('default', NULL, 'workspace', NULL)" >/dev/null 2>&1; then
            echo "::error::openbrain_monitor can execute a memory_scope helper"
            exit 1
          fi
          echo "openbrain_monitor probes succeeded; memory tables, registry, and helpers denied"

      - name: Smoke test — thought filters keep GIN and scope HNSW iteration
        run: |
          # The retired RPC must not survive a fresh/replayed schema. Search is
          # owned by server/queries.ts for MCP, REST, and future hybrid legs.
          retired=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT to_regprocedure('public.match_thoughts(vector,double precision,integer,jsonb)') IS NULL")
          test "$retired" = "t" || { echo "::error::retired match_thoughts RPC still exists"; exit 1; }

          # The fixture asserts exact filter semantics, makes one positive term
          # selective, verifies transaction-local HNSW iteration, and EXPLAINs
          # both live vector+filter query shapes.
          plan=$(docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            < db/search-filter-plan-smoke.sql)
          grep -q 'idx_thoughts_metadata' <<< "$plan" || {
            echo "::error::positive metadata containment did not select idx_thoughts_metadata"
            echo "$plan"
            exit 1
          }
          grep -q 'idx_thoughts_embedding_hnsw' <<< "$plan" || {
            echo "::error::exclude-only vector search did not select idx_thoughts_embedding_hnsw"
            echo "$plan"
            exit 1
          }
          echo "positive filter selected metadata GIN; filtered search selected HNSW with scoped iteration"

      - name: Smoke test — hybrid search finds vector and literal candidates
        run: |
          # Reapply the upgrade migration to prove its existing-database path
          # remains idempotent, then exercise the query shape as the real app
          # role rather than relying on superuser-only access.
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/05-hybrid-search.sql >/dev/null
          plan=$(docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            < db/hybrid-search-smoke.sql)
          grep -q 'idx_thoughts_content_tsv' <<< "$plan" || {
            echo "::error::full-text predicate did not select idx_thoughts_content_tsv"
            echo "$plan"
            exit 1
          }
          grep -q 'idx_thoughts_content_trgm' <<< "$plan" || {
            echo "::error::literal fallback did not select idx_thoughts_content_trgm"
            echo "$plan"
            exit 1
          }
          grep -q 'idx_thoughts_embedding_hnsw' <<< "$plan" || {
            echo "::error::hybrid vector candidate leg did not select idx_thoughts_embedding_hnsw"
            echo "$plan"
            exit 1
          }
          echo "hybrid semantics passed; vector, FTS, and literal legs selected their indexes"

      - name: Smoke test — late funnel rows are summarized before retention deletes them
        run: |
          # The late-arrival retention race (audit finding PR55-OPS-001): a
          # row whose event day is already beyond the raw-retention horizon
          # — inserted here 31 days back — must land in funnel_access_summary
          # in the SAME run whose retention pass deletes the raw evidence.
          # Insert as the ingester role and run the production SQL as the app
          # role, mirroring the deployed writer/runner split (this also
          # asserts openbrain_app's grants cover every statement in the file).
          docker exec -e PGPASSWORD="$OPENBRAIN_INGESTER_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_ingester -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO funnel_access_log
               (ts, socket, client_ip, method, path, status, duration_ms, bytes_out, user_agent)
             VALUES
               (now() - interval '31 days', 'funnel', '203.0.113.7'::inet,
                'GET', '/mcp', 401, 12, 100, 'late-summary-smoke')"

          docker exec -i -e PGPASSWORD="$OPENBRAIN_APP_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_app -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null

          verdict=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT
               (SELECT COUNT(*) FROM funnel_access_log
                 WHERE user_agent = 'late-summary-smoke'),
               (SELECT COUNT(*) FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 31
                   AND socket = 'funnel' AND status_class = '4xx'
                   AND request_count = 1)")
          test "$verdict" = "0|1" || {
            echo "::error::expected raw row deleted + one summary row (raw|summary=0|1), got $verdict"
            exit 1
          }

          # Idempotency: a second run must neither double-count nor
          # resurrect the day.
          docker exec -i -e PGPASSWORD="$OPENBRAIN_APP_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_app -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null
          verdict2=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT COUNT(*), COALESCE(MAX(request_count), 0)
             FROM funnel_access_summary
             WHERE day = (now() AT TIME ZONE 'UTC')::date - 31")
          test "$verdict2" = "1|1" || {
            echo "::error::second run changed the late-day summary (rows|count=$verdict2, expected 1|1)"
            exit 1
          }
          echo "late 31-day-old row summarized before deletion; re-run idempotent"

      - name: Smoke test — concurrent insert survives the rollup/retention transaction
        run: |
          # The snapshot race behind summarize_funnel.sql's REPEATABLE READ:
          # under default READ COMMITTED, a raw row committed while the
          # rollup transaction is mid-flight is invisible to the aggregation
          # snapshot but visible to the later retention DELETE — deleted
          # without ever being summarized. Choreography: hold a FOR UPDATE
          # lock on the summary row the rollup's upsert will conflict on
          # (so the rollup blocks AFTER taking its snapshot), commit a
          # concurrent raw row for the same day, release the lock, and
          # assert the concurrent row survived for a later run.
          PSQL_SUPER=(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            -v ON_ERROR_STOP=1)

          # Seed: a delete-eligible raw row + its summary row (lock target).
          # tailnet/2xx keeps this disjoint from the previous step's rows.
          "${PSQL_SUPER[@]}" -c \
            "INSERT INTO funnel_access_log (ts, socket, status, user_agent)
             VALUES (now() - interval '31 days', 'tailnet', 200, 'rr-seed');
             INSERT INTO funnel_access_summary
               (day, socket, status_class, request_count, unique_ips,
                top_paths, top_user_agents, computed_at)
             VALUES ((now() AT TIME ZONE 'UTC')::date - 31, 'tailnet', '2xx',
                     0, 0, '[]'::jsonb, '[]'::jsonb, now())" >/dev/null

          # Locker session: take the row lock, then hold the transaction
          # open reading from a FIFO until we release it. The FIFO lives
          # in a freshly reserved temp dir (mktemp -u alone would race the
          # name between allocation and mkfifo).
          ctl_dir=$(mktemp -d)
          trap 'rm -rf "$ctl_dir"' EXIT
          ctl="$ctl_dir/lock_ctl"; mkfifo "$ctl"
          { echo "BEGIN;
                  SELECT 1 FROM funnel_access_summary
                  WHERE day = (now() AT TIME ZONE 'UTC')::date - 31
                    AND socket = 'tailnet' AND status_class = '2xx'
                  FOR UPDATE;"; cat "$ctl"; } | \
            docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
              psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 >/dev/null &
          locker=$!

          # Wait until the locker's transaction holds the lock (its backend
          # parks idle-in-transaction once FOR UPDATE returns).
          n=0
          for i in $(seq 1 30); do
            n=$("${PSQL_SUPER[@]}" -tAc \
              "SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'idle in transaction'")
            [ "$n" -ge 1 ] && break; sleep 1
          done
          [ "$n" -ge 1 ] || { echo "::error::locker never took the lock"; exit 1; }

          # Rollup in the background: takes its snapshot, computes, then
          # blocks on the locked summary row.
          docker exec -i -e PGPASSWORD="$OPENBRAIN_APP_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_app -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null &
          rollup=$!

          # Wait until the rollup is genuinely lock-blocked.
          b=0
          for i in $(seq 1 30); do
            b=$("${PSQL_SUPER[@]}" -tAc \
              "SELECT COUNT(*) FROM pg_stat_activity
               WHERE wait_event_type = 'Lock' AND query LIKE '%funnel_access_summary%'")
            [ "$b" -ge 1 ] && break; sleep 1
          done
          [ "$b" -ge 1 ] || { echo "::error::rollup never blocked on the summary lock"; exit 1; }

          # The concurrent row: commits after the rollup's snapshot.
          "${PSQL_SUPER[@]}" -c \
            "INSERT INTO funnel_access_log (ts, socket, status, user_agent)
             VALUES (now() - interval '31 days', 'tailnet', 200, 'rr-concurrent')" >/dev/null

          # Release the lock; let the rollup complete. (The EXIT trap
          # above cleans up the FIFO's temp dir.)
          echo "COMMIT;" > "$ctl"
          wait "$rollup" || { echo "::error::rollup transaction failed"; exit 1; }
          wait "$locker" || true

          verdict=$("${PSQL_SUPER[@]}" -tAc \
            "SELECT
               (SELECT COUNT(*) FROM funnel_access_log WHERE user_agent = 'rr-concurrent'),
               (SELECT COUNT(*) FROM funnel_access_log WHERE user_agent = 'rr-seed'),
               (SELECT request_count FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 31
                   AND socket = 'tailnet' AND status_class = '2xx')")
          test "$verdict" = "1|0|1" || {
            echo "::error::concurrent row lost to the snapshot race (concurrent|seed|count=$verdict, want 1|0|1)"
            exit 1
          }
          echo "concurrent insert survived the rollup transaction; seed summarized+retired (1|0|1)"

          # Eventual accounting: the survivor's day is already finalized, so
          # the next run must MERGE it into the existing summary — the
          # cumulative total counts both rows — and retire the raw row.
          # (A replace-style recompute would shrink the total back to 1:
          # the seed's raw evidence is gone.)
          docker exec -i -e PGPASSWORD="$OPENBRAIN_APP_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_app -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null
          verdict2=$("${PSQL_SUPER[@]}" -tAc \
            "SELECT
               (SELECT COUNT(*) FROM funnel_access_log
                 WHERE user_agent IN ('rr-seed', 'rr-concurrent')),
               (SELECT request_count FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 31
                   AND socket = 'tailnet' AND status_class = '2xx')")
          test "$verdict2" = "0|2" || {
            echo "::error::survivor was not merged into the finalized summary (raw|count=$verdict2, want 0|2)"
            exit 1
          }
          echo "next run merged the survivor additively into the finalized day (0|2)"

      - name: Smoke test — bounded top-3 sketch semantics are pinned
        run: |
          # top_paths / top_user_agents are documented as bounded top-3
          # sketches: finalization discards per-key counts below third
          # place, so a merge combines two truncated lists and a dropped
          # key's history cannot re-enter — a late surge for such a key
          # raises the exact request_count but may not displace the shown
          # top 3. Pin that accepted behavior so any future widening of
          # the sketch is a deliberate change, not silent drift.
          #
          # Finalized day: tops /a:10 /b:9 /c:8 (an historical /d:7 was
          # already discarded at finalization — count 34 includes it).
          # Late /d ×5 arrives: true /d total is 12 (the real leader),
          # but the sketch can only see the remainder's 5.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO funnel_access_summary
               (day, socket, status_class, request_count, unique_ips,
                top_paths, top_user_agents, computed_at)
             VALUES ((now() AT TIME ZONE 'UTC')::date - 40, 'funnel', '2xx', 34, 4,
                     '[{\"path\": \"/a\", \"count\": 10}, {\"path\": \"/b\", \"count\": 9}, {\"path\": \"/c\", \"count\": 8}]'::jsonb,
                     '[]'::jsonb, now() - interval '9 days');
             INSERT INTO funnel_access_log (ts, socket, status, path, user_agent)
             SELECT now() - interval '40 days', 'funnel', 200, '/d', 'sketch-pin'
             FROM generate_series(1, 5)" >/dev/null

          docker exec -i -e PGPASSWORD="$OPENBRAIN_APP_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_app -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null

          verdict=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT request_count,
                    (SELECT string_agg(e->>'path', ',' ORDER BY (e->>'count')::bigint DESC)
                       FROM jsonb_array_elements(top_paths) AS e),
                    (SELECT COUNT(*) FROM funnel_access_log WHERE user_agent = 'sketch-pin')
             FROM funnel_access_summary
             WHERE day = (now() AT TIME ZONE 'UTC')::date - 40
               AND socket = 'funnel' AND status_class = '2xx'")
          test "$verdict" = "39|/a,/b,/c|0" || {
            echo "::error::top-N sketch pin drifted (count|tops|raw=$verdict, want 39|/a,/b,/c|0)"
            exit 1
          }
          echo "sketch pinned: request_count exact (34+5=39), below-3rd /d stays out of tops, raw retired"

      - name: Smoke test — app-qube wrapper publishes remote rollups atomically
        run: |
          systemd-analyze verify \
            deploy/qubes/app-qube/funnel-summary.service \
            deploy/qubes/app-qube/funnel-summary.timer
          systemd-analyze calendar '*-*-* 00:30:00 UTC' >/dev/null

          smoke_root="$RUNNER_TEMP/funnel-summary-wrapper"
          report_dir="$smoke_root/reports"
          env_file="$smoke_root/funnel-summary.env"
          psql_shim="$smoke_root/psql"
          probe_bin="$smoke_root/bin"
          install -d -m 0700 "$smoke_root" "$report_dir" "$probe_bin"

          # The job environment already exports OPENBRAIN_APP_PASSWORD. Assert
          # that the wrapper strips that attribute before its first external
          # command, not merely before the eventual database client.
          cat > "$probe_bin/dirname" <<'SH'
          #!/usr/bin/env bash
          if [[ -v OPENBRAIN_APP_PASSWORD ]]; then
            echo "OPENBRAIN_APP_PASSWORD leaked into the first external child" >&2
            exit 39
          fi
          exec /usr/bin/dirname "$@"
          SH
          chmod 0755 "$probe_bin/dirname"

          # Exercise the production host-psql argument path while reusing this
          # job's initialized Postgres fixture. The shim crosses into pgci and
          # forwards stdin, args, and PGPASSWORD unchanged.
          cat > "$psql_shim" <<'SH'
          #!/usr/bin/env bash
          test "${PGPASSWORD:-}" = ci_app_pw || {
            echo "expected command-scoped PGPASSWORD" >&2
            exit 40
          }
          if [[ -v OPENBRAIN_APP_PASSWORD ]]; then
            echo "OPENBRAIN_APP_PASSWORD leaked into the external client" >&2
            exit 41
          fi
          exec docker exec -i -e PGPASSWORD pgci psql "$@"
          SH
          chmod 0755 "$psql_shim"

          {
            printf 'SUMMARY_BACKEND=postgres\n'
            printf 'DB_HOST=127.0.0.1\n'
            printf 'DB_PORT=5432\n'
            printf 'POSTGRES_DB=%q\n' "$POSTGRES_DB"
            # Exercise the second guard too: a sourced file may explicitly
            # restore the credential's export attribute after the first-child check.
            printf 'export OPENBRAIN_APP_PASSWORD=%q\n' "$OPENBRAIN_APP_PASSWORD"
            printf 'SUMMARY_SQL_FILE=%q\n' "$GITHUB_WORKSPACE/db/summarize_funnel.sql"
            printf 'SUMMARY_DIR=%q\n' "$report_dir"
            printf 'PSQL_BIN=%q\n' "$psql_shim"
          } > "$env_file"
          chmod 0600 "$env_file"

          PATH="$probe_bin:$PATH" FUNNEL_SUMMARY_ENV_FILE="$env_file" \
            scripts/funnel_daily_summary.sh

          mapfile -t reports < <(find "$report_dir" -maxdepth 1 -type f -name 'funnel-summary-*.md' -print)
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "::error::expected exactly one published summary, got ${#reports[@]}"
            find "$report_dir" -maxdepth 1 -ls
            exit 1
          fi
          report=${reports[0]}
          grep -Fq '# Funnel observability report' "$report"
          test "$(grep -Fc '````' "$report")" -eq 2
          test "$(stat -c '%a' "$report")" = 600
          first_hash=$(sha256sum "$report" | awk '{print $1}')

          # Refuse to source a credential file after its private mode drifts.
          # Rejection happens before report staging or the external client.
          chmod 0644 "$env_file"
          set +e
          PATH="$probe_bin:$PATH" FUNNEL_SUMMARY_ENV_FILE="$env_file" \
            scripts/funnel_daily_summary.sh \
            >"$smoke_root/insecure.out" 2>"$smoke_root/insecure.err"
          insecure_rc=$?
          set -e
          test "$insecure_rc" -eq 2
          grep -Fq 'env file must have no group/other permissions' "$smoke_root/insecure.err"
          chmod 0600 "$env_file"
          test "$(sha256sum "$report" | awk '{print $1}')" = "$first_hash"
          test -z "$(find "$report_dir" -maxdepth 1 -type f -name '.funnel-summary-*' -print -quit)"

          # Do not follow even an owner-created symlink to a credential file;
          # the configured path itself must be the inspected regular file.
          ln -s "$env_file" "$smoke_root/symlink.env"
          set +e
          PATH="$probe_bin:$PATH" FUNNEL_SUMMARY_ENV_FILE="$smoke_root/symlink.env" \
            scripts/funnel_daily_summary.sh \
            >"$smoke_root/symlink.out" 2>"$smoke_root/symlink.err"
          symlink_rc=$?
          set -e
          test "$symlink_rc" -eq 2
          grep -Fq 'env file must be a regular, non-symlink file' "$smoke_root/symlink.err"
          test "$(sha256sum "$report" | awk '{print $1}')" = "$first_hash"
          test -z "$(find "$report_dir" -maxdepth 1 -type f -name '.funnel-summary-*' -print -quit)"

          # A failed same-day rerun must leave the prior complete report in
          # place, remove its unpublished staging file, and normalize the
          # external client's status to the documented runtime-failure code.
          cat > "$psql_shim" <<'SH'
          #!/usr/bin/env bash
          exit 42
          SH
          chmod 0755 "$psql_shim"
          set +e
          PATH="$probe_bin:$PATH" FUNNEL_SUMMARY_ENV_FILE="$env_file" \
            scripts/funnel_daily_summary.sh
          failed_rc=$?
          set -e
          test "$failed_rc" -eq 1
          test "$(sha256sum "$report" | awk '{print $1}')" = "$first_hash"
          test -z "$(find "$report_dir" -maxdepth 1 -type f -name '.funnel-summary-*' -print -quit)"

          # Single-host default path: SUMMARY_SQL_FILE as the two-file list,
          # both halves in ONE psql session, one report. This is also the only
          # place db/summarize_auth_events.sql executes in CI at all — the
          # log-sink job is funnel-only by design, and the corpus steps above
          # run only the funnel half.
          cat > "$psql_shim" <<'SH'
          #!/usr/bin/env bash
          exec docker exec -i -e PGPASSWORD pgci psql "$@"
          SH
          chmod 0755 "$psql_shim"
          both_dir="$smoke_root/reports-both"
          install -d -m 0700 "$both_dir"
          {
            printf 'SUMMARY_BACKEND=postgres\n'
            printf 'DB_HOST=127.0.0.1\n'
            printf 'DB_PORT=5432\n'
            printf 'POSTGRES_DB=%q\n' "$POSTGRES_DB"
            printf 'export OPENBRAIN_APP_PASSWORD=%q\n' "$OPENBRAIN_APP_PASSWORD"
            printf 'SUMMARY_SQL_FILE=%q\n' "$GITHUB_WORKSPACE/db/summarize_funnel.sql $GITHUB_WORKSPACE/db/summarize_auth_events.sql"
            printf 'SUMMARY_DIR=%q\n' "$both_dir"
            printf 'PSQL_BIN=%q\n' "$psql_shim"
          } > "$env_file"
          chmod 0600 "$env_file"
          PATH="$probe_bin:$PATH" FUNNEL_SUMMARY_ENV_FILE="$env_file" \
            scripts/funnel_daily_summary.sh
          mapfile -t both < <(find "$both_dir" -maxdepth 1 -type f -name 'funnel-summary-*.md' -print)
          test "${#both[@]}" -eq 1
          grep -Fq '# Funnel observability report' "${both[0]}"
          grep -Fq '## Rolling 24h — auth-failure reasons (mcp side)' "${both[0]}"
          echo "remote wrapper confined its credential, rejected mode drift, and preserved its report on failure; the single-host two-file list ran both halves in one session"

      - name: Container logs on failure
        if: failure()
        run: docker logs pgci || true

  log-sink-init:
    name: log sink init, invariants, and rollup
    runs-on: ubuntu-latest
    env:
      # The ingress qube's local Funnel-log sink is a SEPARATE cluster from the
      # corpus: two relations, three roles, unix socket only. This job proves
      # the three claims db/log-sink/ makes that nothing else covers.
      POSTGRES_DB: openbrain_logs
      POSTGRES_USER: postgres
      # CI-only throwaway credentials for an ephemeral container — not secrets.
      POSTGRES_PASSWORD: ci_sink_superuser_pw
      OPENBRAIN_INGESTER_PASSWORD: ci_sink_ingester_pw
      OPENBRAIN_LOGS_ROLLUP_PASSWORD: ci_sink_rollup_pw
      OPENBRAIN_MONITOR_PASSWORD: ci_sink_monitor_pw
    steps:
      # Same fork-safe ref pattern as ci.yml.
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      - name: Ingress rollup units parse (mirror of the app-qube check)
        run: |
          systemd-analyze verify \
            deploy/qubes/ingress-qube/funnel-summary.service \
            deploy/qubes/ingress-qube/funnel-summary.timer
          systemd-analyze calendar '*-*-* 00:40:00 UTC' >/dev/null

      - name: Derive the sink image from compose (single source of truth)
        run: |
          # Same approach as the readonly-pg-dump job: match the pin itself, not
          # a line offset from the service key — a comment block between the two
          # (there is one) would break an `-A<n>` window. `-m1` avoids SIGPIPE
          # from `head`; `|| true` lets the guard below emit a clear error.
          img=$(grep -m1 -oE 'postgres:[A-Za-z0-9._-]+' deploy/qubes/ingress-qube/docker-compose.yml || true)
          test -n "$img" || { echo "::error::no postgres image pin found in deploy/qubes/ingress-qube/docker-compose.yml"; exit 1; }
          echo "PG_IMAGE=$img" >> "$GITHUB_ENV"
          echo "Using $img (from deploy/qubes/ingress-qube/docker-compose.yml)"

      - name: Start the sink exactly as the ingress qube does
        run: |
          set -euo pipefail
          # Mirrors the compose service: socket-only (no published port, empty
          # listen_addresses) and --auth-local=scram so `local all all trust`
          # cannot make the least-privilege roles decorative.
          docker run -d --name sinkci --network none \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -e POSTGRES_INITDB_ARGS="--auth-local=scram-sha-256 --auth-host=scram-sha-256" \
            -e POSTGRES_HOST_AUTH_METHOD=reject \
            -e OPENBRAIN_INGESTER_PASSWORD -e OPENBRAIN_LOGS_ROLLUP_PASSWORD \
            -e OPENBRAIN_MONITOR_PASSWORD \
            -v "$GITHUB_WORKSPACE/db/log-sink/00-log-sink-roles.sh:/docker-entrypoint-initdb.d/00-log-sink-roles.sh:ro" \
            -v "$GITHUB_WORKSPACE/db/log-sink/01-log-sink.sql:/docker-entrypoint-initdb.d/01-log-sink.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/log-sink/02-log-sink-assertion.sql:/docker-entrypoint-initdb.d/99-log-sink-assertion.sql:ro" \
            "$PG_IMAGE" -c listen_addresses=
          for i in $(seq 1 60); do
            docker exec sinkci pg_isready -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec sinkci pg_isready -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB"

      - name: Init assertion ran and passed
        run: |
          set -euo pipefail
          # Absence is as meaningful as failure: a silently-skipped assertion
          # would let every check below pass against an unverified schema.
          docker logs sinkci 2>&1 | grep -F 'log sink: invariants OK'

      - name: Socket only — no TCP listener exists to connect to
        run: |
          set -euo pipefail
          # PGPASSWORD is REQUIRED here: socket auth is scram (see the step
          # below). Without it psql errors, `la` is empty for the wrong reason,
          # and the emptiness check passes even against a live TCP listener —
          # so assert the query SUCCEEDED before trusting its output.
          la=$(docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
                 psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                 -Atc "select 'la=[' || current_setting('listen_addresses') || ']'")
          echo "$la"
          test "$la" = 'la=[]' || { echo "listen_addresses is not empty: $la" >&2; exit 1; }
          # 5432 == 0x1538. `cmd && { exit 1; }` would abort the step under
          # `set -e` in the PASSING case (grep exits non-zero), so branch on it.
          if docker exec sinkci sh -c 'grep -q ":1538" /proc/net/tcp'; then
            echo "a TCP listener on 5432 exists" >&2; exit 1
          fi
          echo "no TCP listener; socket only"

      - name: Roles hold exactly their grants, and no more
        run: |
          set -euo pipefail
          q() { docker exec -i -e PGPASSWORD="$2" sinkci psql -h /var/run/postgresql -U "$1" -d "$POSTGRES_DB" -Atc "$3"; }
          # The ingester's real statement shape: bare INSERT, no RETURNING
          # (RETURNING would need SELECT on id, which it deliberately lacks).
          q openbrain_ingester "$OPENBRAIN_INGESTER_PASSWORD" \
            "insert into funnel_access_log (ts,socket,client_ip,method,path,status,duration_ms,bytes_out,user_agent) values (now() - interval '2 hours','funnel','192.0.2.9','GET','/mcp',401,12,0,'ci'), (now() - interval '40 days','funnel','192.0.2.9','GET','/old',404,3,0,'ci');"
          ! q openbrain_ingester "$OPENBRAIN_INGESTER_PASSWORD" "select count(*) from funnel_access_log;" 2>/dev/null \
            || { echo "ingester can SELECT; it must be INSERT-only" >&2; exit 1; }
          ! q openbrain_monitor "$OPENBRAIN_MONITOR_PASSWORD" "select count(*) from funnel_access_summary;" 2>/dev/null \
            || { echo "monitor can read the summary table" >&2; exit 1; }
          test "$(q openbrain_monitor "$OPENBRAIN_MONITOR_PASSWORD" 'select count(*) from funnel_access_log;')" = 2
          ! q openbrain_logs_rollup "$OPENBRAIN_LOGS_ROLLUP_PASSWORD" "create table nope(x int);" 2>/dev/null \
            || { echo "a sink role can CREATE in public" >&2; exit 1; }
          echo "ingester INSERT-only, monitor one-table, no role may CREATE"

      - name: Socket connections still require a password
        run: |
          set -euo pipefail
          # The image ships `local all all trust`. If --auth-local did not take,
          # every grant above is decorative because anything reaching the socket
          # could just connect as the superuser.
          ! docker exec -i -e PGPASSWORD=wrong sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'select 1' 2>/dev/null \
            || { echo "superuser accepted a wrong password on the socket" >&2; exit 1; }
          echo "socket auth is scram, not trust"

      - name: The rollup runs against the sink (drift guard vs 02-observability.sql)
        run: |
          set -euo pipefail
          # db/summarize_funnel.sql targets BOTH clusters, so a column renamed
          # in one schema and not the other breaks here rather than in
          # production at 00:40 UTC.
          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql > /tmp/sink-report.md
          grep -F '# Funnel observability report' /tmp/sink-report.md
          # The auth-events half must NOT be here: it owns a table this cluster
          # does not have, which is why the two files are separate.
          ! grep -qF 'auth-failure reasons' /tmp/sink-report.md \
            || { echo "funnel half emitted the auth-events section" >&2; exit 1; }
          # Retention finalized the 40-day-old row into the summary and deleted it.
          q() { docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" -Atc "$1"; }
          test "$(q 'select count(*) from funnel_access_log;')" = 1
          test "$(q 'select count(*) from funnel_access_summary;')" -ge 1
          echo "rollup summarized, retained, and reported"

      - name: Assertion still passes after the rollup, and catches drift
        run: |
          set -euo pipefail
          A() { docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f - < db/log-sink/02-log-sink-assertion.sql; }
          S() { docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "$1"; }
          A | grep -F 'invariants OK'
          # An assertion that never fires is worth nothing — prove each arm.
          S "grant select on funnel_access_summary to openbrain_monitor;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a widened grant" >&2; exit 1; }
          S "revoke select on funnel_access_summary from openbrain_monitor;" >/dev/null
          S "create table thoughts(id int);" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a stray relation" >&2; exit 1; }
          S "drop table thoughts;" >/dev/null
          S "grant select on funnel_access_log to public;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a GRANT to PUBLIC" >&2; exit 1; }
          S "revoke select on funnel_access_log from public;" >/dev/null
          S "create role intruder login;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a stray role" >&2; exit 1; }
          S "drop role intruder;" >/dev/null
          S "grant pg_read_all_data to openbrain_ingester;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed an inherited (membership) privilege" >&2; exit 1; }
          S "revoke pg_read_all_data from openbrain_ingester;" >/dev/null
          S "grant insert on funnel_access_log to openbrain_ingester with grant option;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed WITH GRANT OPTION" >&2; exit 1; }
          S "revoke grant option for insert on funnel_access_log from openbrain_ingester;" >/dev/null
          S "grant select on funnel_access_log to pg_monitor;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a grant to a foreign grantee" >&2; exit 1; }
          S "revoke select on funnel_access_log from pg_monitor;" >/dev/null
          S "grant create on database $POSTGRES_DB to openbrain_monitor;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed database CREATE" >&2; exit 1; }
          S "revoke create on database $POSTGRES_DB from openbrain_monitor;" >/dev/null
          S "create function public.ci_probe() returns bigint language sql security definer as 'select count(*) from funnel_access_log';" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a SECURITY DEFINER routine" >&2; exit 1; }
          S "drop function public.ci_probe();" >/dev/null
          S "create schema ci_extra authorization openbrain_ingester;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a stray schema" >&2; exit 1; }
          S "drop schema ci_extra;" >/dev/null
          S "create function pg_catalog.ci_leak() returns bigint language sql security definer as 'select count(*) from funnel_access_log';" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a pg_catalog definer function" >&2; exit 1; }
          S "drop function pg_catalog.ci_leak();" >/dev/null
          S "create function information_schema.ci_leak() returns int language sql as 'select 1';" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed an information_schema routine" >&2; exit 1; }
          S "drop function information_schema.ci_leak();" >/dev/null
          S "create view information_schema.ci_leak_view as select 1 as x;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed an information_schema view" >&2; exit 1; }
          S "drop view information_schema.ci_leak_view;" >/dev/null
          A | grep -F 'invariants OK'
          echo "assertion catches widened grants, grant options, memberships, foreign grantees, database CREATE, stray relations, stray roles, stray schemas, stray routines (incl. system-schema definer functions and views), and PUBLIC"

      - name: Container logs on failure
        if: failure()
        run: docker logs sinkci || true
