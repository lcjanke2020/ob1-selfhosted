# Backup-recoverability smoke tests for the database init scripts and encrypted
# app-qube backup publisher.
#
# The off-box backup runs `pg_dump` as the trusted SELECT-only
# `openbrain_readonly` role (BYPASSRLS is required for pg_dump under forced
# RLS; the grants assertion rejects it on the app role). pg_dump reads every
# sequence's state (`SELECT last_value, is_called
# FROM <seq>`), so the role needs SELECT on all sequences, not just tables —
# a privilege that's easy to forget when a new serial/identity column lands.
# That is exactly what silently broke the nightly backup once the sessions PK
# became an identity column.
#
# The same completed init is also the integration fixture for the corpus
# breakout invariant. The assertion is mounted last, then deliberately re-run
# after sink-only roles, Funnel relations, and stale/unprovable pg_hba rules are
# introduced; each old-shape fixture must fail closed.
#
# Rather than enumerate privileges in a static assertion (which lags the next
# new object type, and can't see an object created later by a different
# superuser), this job exercises the REAL init path on a throwaway pgvector
# container — the same db/*.sql files, in the order the postgres entrypoint
# runs them — and then performs the actual operation the backup performs: a
# full `pg_dump -U openbrain_readonly`. If the read-only role can't dump any
# object, the job fails. This catches this class of regression generically.
#
# The corpus implementation lives in scripts/ci/ so every family is runnable
# outside Actions. This workflow owns only checkout/runtime setup, the shared
# push/PR path contract, and the separate log-sink orchestration that remains
# inline. The anchored path list keeps both event types on exactly one source
# of truth.

name: DB init smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: &db-init-paths
      - "db/**"
      - "server/session_queries.ts"
      - "server/queries.ts"
      - "server/metadata_notifications.ts"
      - "server/metadata_notifications_db_smoke.ts"
      - "server/access_tokens.ts"
      - "server/auth_context.ts"
      - "server/access_tokens_db_smoke.ts"
      - "server/auth_audit_db_smoke.ts"
      - "server/auth_audit_upgrade_db_smoke.ts"
      - "server/auth_middleware_audit_db_smoke.ts"
      - "server/auth.ts"
      - "server/inet.ts"
      - "server/db_boot_probe.ts"
      - "server/auth_audit.ts"
      - "server/session_search_db_smoke.ts"
      - "server/session_ordering_db_smoke.ts"
      - "server/thought_mutations_db_smoke.ts"
      - "server/scoped_db.ts"
      - "server/scope_contract.ts"
      - "server/db_pool.ts"
      - "server/embeddings.ts"
      - "server/config.ts"
      - "server/session_toml.ts"
      - "server/postgres_deferred_patched.ts"
      - "server/deno.json"
      - "server/deno.lock"
      - "deploy/compose-local/docker-compose.yml"
      - "deploy/compose-tailnet/docker-compose.pattern-b.yml"
      - "deploy/qubes/app-qube/backup/**"
      - "deploy/qubes/ingress-qube/docker-compose.yml"
      - "scripts/adopt-log-sink-marker.sh"
      - "scripts/funnel_daily_summary.sh"
      - "scripts/funnel_monitor.sh"
      - "scripts/funnel_monitor_test.sh"
      - "deploy/qubes/ingress-qube/funnel-monitor.env.example"
      - "deploy/qubes/ingress-qube/funnel-monitor.service"
      - "deploy/qubes/ingress-qube/funnel-monitor.timer"
      - "deploy/qubes/ingress-qube/funnel-summary.env.example"
      - "deploy/qubes/ingress-qube/funnel-summary.service"
      - "deploy/qubes/ingress-qube/funnel-summary.timer"
      - "deploy/qubes/app-qube/auth-events-summary.env.example"
      - "deploy/qubes/app-qube/auth-events-summary.service"
      - "deploy/qubes/app-qube/auth-events-summary.timer"
      - "scripts/ci/**"
      - ".github/workflows/db-init.yml"
  push:
    branches: [main]
    paths: *db-init-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-pg-dump:
    name: readonly role can pg_dump
    runs-on: ubuntu-latest
    env:
      # The local runner derives PG_IMAGE from compose at runtime so it cannot
      # drift from the deployed stack's Postgres pin.
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
      # CI-only throwaway credentials for an ephemeral container — not secrets.
      POSTGRES_PASSWORD: ci_superuser_pw
      OPENBRAIN_APP_PASSWORD: ci_app_pw
      OPENBRAIN_READONLY_PASSWORD: ci_readonly_pw
      # Dedicated create/list/revoke role for the native-token smoke.
      OPENBRAIN_TOKEN_ADMIN_PASSWORD: ci_token_admin_pw
    steps:
      # Same fork-safe ref pattern as ci.yml.
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Run corpus DB-init smoke families
        run: bash scripts/ci/run_db_init_smokes.sh all

  log-sink-init:
    name: log sink init, invariants, and rollup
    runs-on: ubuntu-latest
    env:
      # The ingress qube's local Funnel-log sink is a SEPARATE cluster from the
      # corpus: two relations, three roles, unix socket only. This job proves
      # the three claims db/log-sink/ makes that nothing else covers.
      POSTGRES_DB: openbrain_logs
      POSTGRES_USER: postgres
      # CI-only throwaway credentials for an ephemeral container — not secrets.
      POSTGRES_PASSWORD: ci_sink_superuser_pw
      OPENBRAIN_INGESTER_PASSWORD: ci_sink_ingester_pw
      OPENBRAIN_LOGS_ROLLUP_PASSWORD: ci_sink_rollup_pw
      OPENBRAIN_MONITOR_PASSWORD: ci_sink_monitor_pw
    steps:
      # Same fork-safe ref pattern as ci.yml.
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      - name: Ingress rollup units parse (mirror of the app-qube check)
        run: |
          systemd-analyze verify \
            deploy/qubes/ingress-qube/funnel-summary.service \
            deploy/qubes/ingress-qube/funnel-summary.timer
          systemd-analyze calendar '*-*-* 00:40:00 UTC' >/dev/null

      - name: Derive the sink image from compose (single source of truth)
        run: |
          # Same approach as the readonly-pg-dump job: match the pin itself, not
          # a line offset from the service key — a comment block between the two
          # (there is one) would break an `-A<n>` window. `-m1` avoids SIGPIPE
          # from `head`; `|| true` lets the guard below emit a clear error.
          img=$(grep -m1 -oE 'postgres:[A-Za-z0-9._-]+' deploy/qubes/ingress-qube/docker-compose.yml || true)
          test -n "$img" || { echo "::error::no postgres image pin found in deploy/qubes/ingress-qube/docker-compose.yml"; exit 1; }
          echo "PG_IMAGE=$img" >> "$GITHUB_ENV"
          echo "Using $img (from deploy/qubes/ingress-qube/docker-compose.yml)"

      - name: Healthy pre-marker sink is adopted only after current assertion
        run: |
          set -euo pipefail
          adoption_root="$RUNNER_TEMP/log-sink-adoption"
          adoption_volume="sinkci-adopt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$adoption_root"

          # Head's 00/01 changes from the last pre-marker release are comments
          # only. Omitting the wrapper + zz marker reconstructs that release's
          # persisted catalog/PGDATA shape; 99 proves the starting sink valid.
          cat > "$adoption_root/compose.yml" <<'YAML'
          services:
            log-sink:
              image: ${PG_IMAGE:?PG_IMAGE is required}
              network_mode: none
              environment:
                POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
                POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
                POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
                POSTGRES_HOST_AUTH_METHOD: reject
                OPENBRAIN_INGESTER_PASSWORD: ${OPENBRAIN_INGESTER_PASSWORD:?OPENBRAIN_INGESTER_PASSWORD is required}
                OPENBRAIN_LOGS_ROLLUP_PASSWORD: ${OPENBRAIN_LOGS_ROLLUP_PASSWORD:?OPENBRAIN_LOGS_ROLLUP_PASSWORD is required}
                OPENBRAIN_MONITOR_PASSWORD: ${OPENBRAIN_MONITOR_PASSWORD:-}
              entrypoint: ["docker-entrypoint.sh"]
              command: ["postgres", "-c", "listen_addresses="]
              volumes:
                - log_sink_data:/var/lib/postgresql/data
                - ${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}/db/log-sink/00-log-sink-roles.sh:/docker-entrypoint-initdb.d/00-log-sink-roles.sh:ro
                - ${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}/db/log-sink/01-log-sink.sql:/docker-entrypoint-initdb.d/01-log-sink.sql:ro
                - ${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}/db/log-sink/02-log-sink-assertion.sql:/docker-entrypoint-initdb.d/99-log-sink-assertion.sql:ro
          volumes:
            log_sink_data:
              name: ${ADOPTION_VOLUME:?ADOPTION_VOLUME is required}
          YAML

          cat > "$adoption_root/marker.yml" <<'YAML'
          services:
            log-sink:
              entrypoint: ["/bin/sh", "/usr/local/bin/openbrain-log-sink-entrypoint.sh"]
              volumes:
                - ${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}/db/log-sink/log-sink-entrypoint.sh:/usr/local/bin/openbrain-log-sink-entrypoint.sh:ro
          YAML

          cat > "$adoption_root/.env" <<ENV
          COMPOSE_FILE=compose.yml
          COMPOSE_PROJECT_NAME=sinkci-adopt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          ADOPTION_VOLUME=$adoption_volume
          ENV

          cleanup_adoption() {
            docker compose --project-directory "$adoption_root" \
              --env-file "$adoption_root/.env" \
              -f "$adoption_root/compose.yml" -f "$adoption_root/marker.yml" \
              down -v >/dev/null 2>&1 || true
            docker volume rm "$adoption_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_adoption EXIT

          docker compose --project-directory "$adoption_root" \
            --env-file "$adoption_root/.env" \
            -f "$adoption_root/compose.yml" up -d log-sink
          # pg_isready alone can see the init-phase temporary socket server.
          # PID 1 becomes postgres only after initdb.d ends and the entrypoint
          # execs the final server, eliminating the shutdown/startup gap.
          for i in $(seq 1 60); do
            if docker compose --project-directory "$adoption_root" \
              --env-file "$adoption_root/.env" -f "$adoption_root/compose.yml" \
              exec -T log-sink sh -c \
                'test "$(cat /proc/1/comm)" = postgres && pg_isready -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
                >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready:-}" = 1
          docker compose --project-directory "$adoption_root" \
            --env-file "$adoption_root/.env" -f "$adoption_root/compose.yml" \
            exec -T log-sink sh -c \
              'test ! -e "$PGDATA/.openbrain-log-sink-init-complete"'

          # Preserve a representative historical row across adoption/recreate.
          # A healthy old catalog plus one drift relation must remain unmarked.
          docker compose --project-directory "$adoption_root" \
            --env-file "$adoption_root/.env" -f "$adoption_root/compose.yml" \
            exec -T -e PGPASSWORD="$POSTGRES_PASSWORD" log-sink \
              psql -X -w -h /var/run/postgresql -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
                -c "INSERT INTO public.funnel_access_log
                      (ts, socket, path, status)
                    VALUES ('2026-08-13T00:00:00Z', 'funnel',
                            '/pre-marker-history', 200);
                    CREATE TABLE public.adoption_must_refuse (id integer)"
          set +e
          adoption_output=$(COMPOSE_DIR="$adoption_root" \
            "$GITHUB_WORKSPACE/scripts/adopt-log-sink-marker.sh" 2>&1)
          adoption_rc=$?
          set -e
          test "$adoption_rc" -ne 0
          grep -Fq 'expected exactly (funnel_access_log, funnel_access_summary)' \
            <<< "$adoption_output"
          docker compose --project-directory "$adoption_root" \
            --env-file "$adoption_root/.env" -f "$adoption_root/compose.yml" \
            exec -T log-sink sh -c \
              'test ! -e "$PGDATA/.openbrain-log-sink-init-complete"'

          docker compose --project-directory "$adoption_root" \
            --env-file "$adoption_root/.env" -f "$adoption_root/compose.yml" \
            exec -T -e PGPASSWORD="$POSTGRES_PASSWORD" log-sink \
              psql -X -w -h /var/run/postgresql -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
                -c 'DROP TABLE public.adoption_must_refuse'
          adoption_output=$(COMPOSE_DIR="$adoption_root" \
            "$GITHUB_WORKSPACE/scripts/adopt-log-sink-marker.sh" 2>&1)
          grep -Fq 'log sink: invariants OK' <<< "$adoption_output"
          grep -Fq 'pre-marker volume adopted after current invariants passed' \
            <<< "$adoption_output"
          docker compose --project-directory "$adoption_root" \
            --env-file "$adoption_root/.env" -f "$adoption_root/compose.yml" \
            exec -T log-sink sh -c \
              'test -f "$PGDATA/.openbrain-log-sink-init-complete" && test "$(stat -c %a "$PGDATA/.openbrain-log-sink-init-complete")" = 600'

          # Recreate the service with the new wrapper on the SAME named volume.
          # It must accept the assertion-gated marker and keep the catalog/data.
          docker compose --project-directory "$adoption_root" \
            --env-file "$adoption_root/.env" \
            -f "$adoption_root/compose.yml" -f "$adoption_root/marker.yml" \
            up -d --force-recreate log-sink
          for i in $(seq 1 60); do
            if docker compose --project-directory "$adoption_root" \
              --env-file "$adoption_root/.env" \
              -f "$adoption_root/compose.yml" -f "$adoption_root/marker.yml" \
              exec -T log-sink sh -c \
                'test "$(cat /proc/1/comm)" = postgres && test -f "$PGDATA/.openbrain-log-sink-init-complete" && pg_isready -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
                >/dev/null 2>&1; then
              restarted=1
              break
            fi
            sleep 1
          done
          test "${restarted:-}" = 1
          history_rows=$(docker compose --project-directory "$adoption_root" \
            --env-file "$adoption_root/.env" \
            -f "$adoption_root/compose.yml" -f "$adoption_root/marker.yml" \
            exec -T -e PGPASSWORD="$POSTGRES_PASSWORD" log-sink \
              psql -X -w -h /var/run/postgresql -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" -Atc \
                "SELECT count(*) FROM public.funnel_access_log
                 WHERE path = '/pre-marker-history'")
          test "$history_rows" = 1
          echo "healthy pre-marker volume adopted with history intact; drifted volume refused; wrapper restart passed"

      - name: Failed first init cannot restart as a partial sink
        run: |
          set -euo pipefail
          partial_volume="sinkci-partial-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          failure_sql="$RUNNER_TEMP/log-sink-intentional-init-failure.sql"
          printf '%s\n' '\set ON_ERROR_STOP on' 'SELECT 1 / 0;' > "$failure_sql"
          docker volume create "$partial_volume" >/dev/null
          cleanup_partial() {
            docker rm -f sinkci-partial-first sinkci-partial-restart >/dev/null 2>&1 || true
            docker volume rm "$partial_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_partial EXIT

          set +e
          docker run --name sinkci-partial-first --network none \
            -e POSTGRES_PASSWORD=ci_partial_superuser_pw \
            -v "$partial_volume:/var/lib/postgresql/data" \
            -v "$GITHUB_WORKSPACE/db/log-sink/log-sink-entrypoint.sh:/usr/local/bin/openbrain-log-sink-entrypoint.sh:ro" \
            -v "$failure_sql:/docker-entrypoint-initdb.d/99-intentional-failure.sql:ro" \
            --entrypoint /bin/sh \
            "$PG_IMAGE" /usr/local/bin/openbrain-log-sink-entrypoint.sh \
            postgres -c listen_addresses= >/dev/null 2>&1
          first_rc=$?
          set -e
          test "$first_rc" -ne 0 || {
            echo "::error::intentional first-init failure unexpectedly succeeded"
            exit 1
          }
          docker rm sinkci-partial-first >/dev/null

          set +e
          restart_output=$(docker run --name sinkci-partial-restart --network none \
            -e POSTGRES_PASSWORD=ci_partial_superuser_pw \
            -v "$partial_volume:/var/lib/postgresql/data" \
            -v "$GITHUB_WORKSPACE/db/log-sink/log-sink-entrypoint.sh:/usr/local/bin/openbrain-log-sink-entrypoint.sh:ro" \
            --entrypoint /bin/sh \
            "$PG_IMAGE" /usr/local/bin/openbrain-log-sink-entrypoint.sh \
            postgres -c listen_addresses= 2>&1)
          restart_rc=$?
          set -e
          test "$restart_rc" -ne 0
          grep -Fq 'missing the Open Brain init completion marker' <<< "$restart_output"
          echo "partial PGDATA remained fail-closed across restart"

      - name: Start the sink exactly as the ingress qube does
        run: |
          set -euo pipefail
          # Mirrors the compose service: socket-only (no published port, empty
          # listen_addresses) and --auth-local=scram so `local all all trust`
          # cannot make the least-privilege roles decorative.
          docker run -d --name sinkci --network none \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -e POSTGRES_INITDB_ARGS="--auth-local=scram-sha-256 --auth-host=scram-sha-256" \
            -e POSTGRES_HOST_AUTH_METHOD=reject \
            -e OPENBRAIN_INGESTER_PASSWORD -e OPENBRAIN_LOGS_ROLLUP_PASSWORD \
            -e OPENBRAIN_MONITOR_PASSWORD \
            -v "$GITHUB_WORKSPACE/db/log-sink/log-sink-entrypoint.sh:/usr/local/bin/openbrain-log-sink-entrypoint.sh:ro" \
            -v "$GITHUB_WORKSPACE/db/log-sink/00-log-sink-roles.sh:/docker-entrypoint-initdb.d/00-log-sink-roles.sh:ro" \
            -v "$GITHUB_WORKSPACE/db/log-sink/01-log-sink.sql:/docker-entrypoint-initdb.d/01-log-sink.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/log-sink/02-log-sink-assertion.sql:/docker-entrypoint-initdb.d/99-log-sink-assertion.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/log-sink/03-log-sink-ready.sh:/docker-entrypoint-initdb.d/zz-log-sink-ready.sh:ro" \
            --entrypoint /bin/sh \
            "$PG_IMAGE" /usr/local/bin/openbrain-log-sink-entrypoint.sh \
            postgres -c listen_addresses=
          for i in $(seq 1 60); do
            docker exec sinkci sh -c \
              'test -f "$PGDATA/.openbrain-log-sink-init-complete" && pg_isready -h /var/run/postgresql -U "$1" -d "$2"' \
              ready "$POSTGRES_USER" "$POSTGRES_DB" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec sinkci test -f \
            /var/lib/postgresql/data/.openbrain-log-sink-init-complete
          docker exec sinkci pg_isready -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB"

      - name: Init assertion ran and passed
        run: |
          set -euo pipefail
          # Absence is as meaningful as failure: a silently-skipped assertion
          # would let every check below pass against an unverified schema.
          docker logs sinkci 2>&1 | grep -F 'log sink: invariants OK'
          docker logs sinkci 2>&1 | grep -F 'log sink: init completion marker written'

      - name: Socket only — no TCP listener exists to connect to
        run: |
          set -euo pipefail
          # PGPASSWORD is REQUIRED here: socket auth is scram (see the step
          # below). Without it psql errors, `la` is empty for the wrong reason,
          # and the emptiness check passes even against a live TCP listener —
          # so assert the query SUCCEEDED before trusting its output.
          la=$(docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
                 psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                 -Atc "select 'la=[' || current_setting('listen_addresses') || ']'")
          echo "$la"
          test "$la" = 'la=[]' || { echo "listen_addresses is not empty: $la" >&2; exit 1; }
          # 5432 == 0x1538. `cmd && { exit 1; }` would abort the step under
          # `set -e` in the PASSING case (grep exits non-zero), so branch on it.
          if docker exec sinkci sh -c 'grep -q ":1538" /proc/net/tcp'; then
            echo "a TCP listener on 5432 exists" >&2; exit 1
          fi
          echo "no TCP listener; socket only"

      - name: Roles hold exactly their grants, and no more
        run: |
          set -euo pipefail
          q() { docker exec -i -e PGPASSWORD="$2" sinkci psql -h /var/run/postgresql -U "$1" -d "$POSTGRES_DB" -Atc "$3"; }
          # The ingester's real statement shape: bare INSERT, no RETURNING
          # (RETURNING would need SELECT on id, which it deliberately lacks).
          q openbrain_ingester "$OPENBRAIN_INGESTER_PASSWORD" \
            "insert into funnel_access_log (ts,socket,client_ip,method,path,status,duration_ms,bytes_out,user_agent) values (now() - interval '2 hours','funnel','192.0.2.9','GET','/mcp',401,12,0,'ci'), (now() - interval '40 days','funnel','192.0.2.9','GET','/old',404,3,0,'ci');"
          ! q openbrain_ingester "$OPENBRAIN_INGESTER_PASSWORD" "select count(*) from funnel_access_log;" 2>/dev/null \
            || { echo "ingester can SELECT; it must be INSERT-only" >&2; exit 1; }
          ! q openbrain_monitor "$OPENBRAIN_MONITOR_PASSWORD" "select count(*) from funnel_access_summary;" 2>/dev/null \
            || { echo "monitor can read the summary table" >&2; exit 1; }
          test "$(q openbrain_monitor "$OPENBRAIN_MONITOR_PASSWORD" 'select count(*) from funnel_access_log;')" = 2
          q openbrain_monitor "$OPENBRAIN_MONITOR_PASSWORD" \
            "WITH bounds AS MATERIALIZED (
               SELECT COALESCE(MAX(id), 0)::bigint AS max_id,
                      FLOOR(EXTRACT(EPOCH FROM now()))::bigint AS cutoff_epoch
               FROM funnel_access_log
             )
             SELECT max_id || '|' || cutoff_epoch || '|' ||
                    (SELECT COUNT(*) FROM funnel_access_log AS event
                     WHERE event.id <= bounds.max_id
                       AND event.socket = 'funnel'
                       AND event.status = 401
                       AND event.ts > now() - interval '5 minutes')
             FROM bounds;" | grep -Eq '^[0-9]+\|[0-9]+\|[0-9]+$'
          ! q openbrain_logs_rollup "$OPENBRAIN_LOGS_ROLLUP_PASSWORD" "create table nope(x int);" 2>/dev/null \
            || { echo "a sink role can CREATE in public" >&2; exit 1; }
          echo "ingester INSERT-only, monitor one-table real probes, no role may CREATE"

      - name: Smoke test — late in-horizon funnel rows recompute their event day
        run: |
          # Ordinary late-arrival path: summarize an event day while it is
          # still inside the 30-day raw-retention horizon, insert another row
          # for that already-summarized day, then prove the next run recomputes
          # the day from all retained raw evidence. Raw rows must remain until
          # finalization, and repeated runs must not double-count.
          event_ts="(((now() AT TIME ZONE 'UTC')::date - 2) + time '12:00') AT TIME ZONE 'UTC'"

          docker exec -e PGPASSWORD="$OPENBRAIN_INGESTER_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_ingester -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO funnel_access_log
               (ts, socket, client_ip, method, path, status, duration_ms, bytes_out, user_agent)
             VALUES
               ($event_ts, 'funnel', '203.0.113.17'::inet,
                'GET', '/late/first', 401, 11, 101, 'late-window-first')"

          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null

          first=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT
               (SELECT COUNT(*) FROM funnel_access_log
                 WHERE user_agent LIKE 'late-window-%'),
               (SELECT COUNT(*) FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 2
                   AND socket = 'funnel' AND status_class = '4xx'),
               COALESCE((SELECT request_count FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 2
                   AND socket = 'funnel' AND status_class = '4xx'), 0)")
          test "$first" = "1|1|1" || {
            echo "::error::first in-horizon rollup drifted (raw|rows|count=$first, want 1|1|1)"
            exit 1
          }

          # These rows arrive after their event day already has a summary. The
          # next run must replace that summary from the complete retained raw
          # set, not leave the day stale or add onto the old aggregate. One
          # repeats the original IP so request_count and unique_ips diverge.
          docker exec -e PGPASSWORD="$OPENBRAIN_INGESTER_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_ingester -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO funnel_access_log
               (ts, socket, client_ip, method, path, status, duration_ms, bytes_out, user_agent)
             VALUES
               ($event_ts, 'funnel', '203.0.113.18'::inet,
                'GET', '/late/second', 401, 13, 103, 'late-window-second'),
               ($event_ts, 'funnel', '203.0.113.17'::inet,
                'GET', '/late/third', 401, 15, 105, 'late-window-third')"

          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null

          second=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT
               (SELECT COUNT(*) FROM funnel_access_log
                 WHERE user_agent LIKE 'late-window-%'),
               (SELECT COUNT(*) FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 2
                   AND socket = 'funnel' AND status_class = '4xx'),
               COALESCE((SELECT request_count FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 2
                   AND socket = 'funnel' AND status_class = '4xx'), 0),
               COALESCE((SELECT unique_ips FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 2
                   AND socket = 'funnel' AND status_class = '4xx'), 0)")
          test "$second" = "3|1|3|2" || {
            echo "::error::late-row recompute drifted (raw|rows|count|ips=$second, want 3|1|3|2)"
            exit 1
          }

          # A third pass has the same complete raw set and must therefore be
          # exactly idempotent. The finalization tests below separately prove
          # that D+31 rows are counted before deletion and that still-later
          # arrivals merge additively into an already-finalized day.
          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null
          third=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT COUNT(*), COALESCE(MAX(request_count), 0), COALESCE(MAX(unique_ips), 0)
             FROM funnel_access_summary
             WHERE day = (now() AT TIME ZONE 'UTC')::date - 2
               AND socket = 'funnel' AND status_class = '4xx'")
          test "$third" = "1|3|2" || {
            echo "::error::in-horizon re-run was not idempotent (rows|count|ips=$third, want 1|3|2)"
            exit 1
          }
          echo "late in-horizon row recomputed exactly; raw retained; re-run idempotent"

      - name: Smoke test — late funnel rows are summarized before retention deletes them
        run: |
          # The late-arrival retention race (audit finding PR55-OPS-001): a
          # row whose event day is already beyond the raw-retention horizon
          # — inserted here 31 days back — must land in funnel_access_summary
          # in the SAME run whose retention pass deletes the raw evidence.
          # Insert as the ingester role and run the production SQL as the app
          # role, mirroring the deployed writer/runner split (this also
          # asserts openbrain_logs_rollup's grants cover every statement in the file).
          docker exec -e PGPASSWORD="$OPENBRAIN_INGESTER_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_ingester -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO funnel_access_log
               (ts, socket, client_ip, method, path, status, duration_ms, bytes_out, user_agent)
             VALUES
               (now() - interval '31 days', 'funnel', '203.0.113.7'::inet,
                'GET', '/mcp', 401, 12, 100, 'late-summary-smoke')"

          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null

          verdict=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT
               (SELECT COUNT(*) FROM funnel_access_log
                 WHERE user_agent = 'late-summary-smoke'),
               (SELECT COUNT(*) FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 31
                   AND socket = 'funnel' AND status_class = '4xx'
                   AND request_count = 1)")
          test "$verdict" = "0|1" || {
            echo "::error::expected raw row deleted + one summary row (raw|summary=0|1), got $verdict"
            exit 1
          }

          # Idempotency: a second run must neither double-count nor
          # resurrect the day.
          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null
          verdict2=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT COUNT(*), COALESCE(MAX(request_count), 0)
             FROM funnel_access_summary
             WHERE day = (now() AT TIME ZONE 'UTC')::date - 31")
          test "$verdict2" = "1|1" || {
            echo "::error::second run changed the late-day summary (rows|count=$verdict2, expected 1|1)"
            exit 1
          }
          echo "late 31-day-old row summarized before deletion; re-run idempotent"

      - name: Smoke test — concurrent insert survives the rollup/retention transaction
        run: |
          # The snapshot race behind summarize_funnel.sql's REPEATABLE READ:
          # under default READ COMMITTED, a raw row committed while the
          # rollup transaction is mid-flight is invisible to the aggregation
          # snapshot but visible to the later retention DELETE — deleted
          # without ever being summarized. Choreography: hold a FOR UPDATE
          # lock on the summary row the rollup's upsert will conflict on
          # (so the rollup blocks AFTER taking its snapshot), commit a
          # concurrent raw row for the same day, release the lock, and
          # assert the concurrent row survived for a later run.
          PSQL_SUPER=(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            -v ON_ERROR_STOP=1)

          # Seed: a delete-eligible raw row + its summary row (lock target).
          # tailnet/2xx keeps this disjoint from the previous step's rows.
          "${PSQL_SUPER[@]}" -c \
            "INSERT INTO funnel_access_log (ts, socket, status, user_agent)
             VALUES (now() - interval '31 days', 'tailnet', 200, 'rr-seed');
             INSERT INTO funnel_access_summary
               (day, socket, status_class, request_count, unique_ips,
                top_paths, top_user_agents, computed_at)
             VALUES ((now() AT TIME ZONE 'UTC')::date - 31, 'tailnet', '2xx',
                     0, 0, '[]'::jsonb, '[]'::jsonb, now())" >/dev/null

          # Locker session: take the row lock, then hold the transaction
          # open reading from a FIFO until we release it. The FIFO lives
          # in a freshly reserved temp dir (mktemp -u alone would race the
          # name between allocation and mkfifo).
          ctl_dir=$(mktemp -d)
          trap 'rm -rf "$ctl_dir"' EXIT
          ctl="$ctl_dir/lock_ctl"; mkfifo "$ctl"
          { echo "BEGIN;
                  SELECT 1 FROM funnel_access_summary
                  WHERE day = (now() AT TIME ZONE 'UTC')::date - 31
                    AND socket = 'tailnet' AND status_class = '2xx'
                  FOR UPDATE;"; cat "$ctl"; } | \
            docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
              psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 >/dev/null &
          locker=$!

          # Wait until the locker's transaction holds the lock (its backend
          # parks idle-in-transaction once FOR UPDATE returns).
          n=0
          for i in $(seq 1 30); do
            n=$("${PSQL_SUPER[@]}" -tAc \
              "SELECT COUNT(*) FROM pg_stat_activity WHERE state = 'idle in transaction'")
            [ "$n" -ge 1 ] && break; sleep 1
          done
          [ "$n" -ge 1 ] || { echo "::error::locker never took the lock"; exit 1; }

          # Rollup in the background: takes its snapshot, computes, then
          # blocks on the locked summary row.
          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null &
          rollup=$!

          # Wait until the rollup is genuinely lock-blocked.
          b=0
          for i in $(seq 1 30); do
            b=$("${PSQL_SUPER[@]}" -tAc \
              "SELECT COUNT(*) FROM pg_stat_activity
               WHERE wait_event_type = 'Lock' AND query LIKE '%funnel_access_summary%'")
            [ "$b" -ge 1 ] && break; sleep 1
          done
          [ "$b" -ge 1 ] || { echo "::error::rollup never blocked on the summary lock"; exit 1; }

          # The concurrent row: commits after the rollup's snapshot.
          "${PSQL_SUPER[@]}" -c \
            "INSERT INTO funnel_access_log (ts, socket, status, user_agent)
             VALUES (now() - interval '31 days', 'tailnet', 200, 'rr-concurrent')" >/dev/null

          # Release the lock; let the rollup complete. (The EXIT trap
          # above cleans up the FIFO's temp dir.)
          echo "COMMIT;" > "$ctl"
          wait "$rollup" || { echo "::error::rollup transaction failed"; exit 1; }
          wait "$locker" || true

          verdict=$("${PSQL_SUPER[@]}" -tAc \
            "SELECT
               (SELECT COUNT(*) FROM funnel_access_log WHERE user_agent = 'rr-concurrent'),
               (SELECT COUNT(*) FROM funnel_access_log WHERE user_agent = 'rr-seed'),
               (SELECT request_count FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 31
                   AND socket = 'tailnet' AND status_class = '2xx')")
          test "$verdict" = "1|0|1" || {
            echo "::error::concurrent row lost to the snapshot race (concurrent|seed|count=$verdict, want 1|0|1)"
            exit 1
          }
          echo "concurrent insert survived the rollup transaction; seed summarized+retired (1|0|1)"

          # Eventual accounting: the survivor's day is already finalized, so
          # the next run must MERGE it into the existing summary — the
          # cumulative total counts both rows — and retire the raw row.
          # (A replace-style recompute would shrink the total back to 1:
          # the seed's raw evidence is gone.)
          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null
          verdict2=$("${PSQL_SUPER[@]}" -tAc \
            "SELECT
               (SELECT COUNT(*) FROM funnel_access_log
                 WHERE user_agent IN ('rr-seed', 'rr-concurrent')),
               (SELECT request_count FROM funnel_access_summary
                 WHERE day = (now() AT TIME ZONE 'UTC')::date - 31
                   AND socket = 'tailnet' AND status_class = '2xx')")
          test "$verdict2" = "0|2" || {
            echo "::error::survivor was not merged into the finalized summary (raw|count=$verdict2, want 0|2)"
            exit 1
          }
          echo "next run merged the survivor additively into the finalized day (0|2)"

      - name: Smoke test — bounded top-3 sketch semantics are pinned
        run: |
          # top_paths / top_user_agents are documented as bounded top-3
          # sketches: finalization discards per-key counts below third
          # place, so a merge combines two truncated lists and a dropped
          # key's history cannot re-enter — a late surge for such a key
          # raises the exact request_count but may not displace the shown
          # top 3. Pin that accepted behavior so any future widening of
          # the sketch is a deliberate change, not silent drift.
          #
          # Finalized day: tops /a:10 /b:9 /c:8 (an historical /d:7 was
          # already discarded at finalization — count 34 includes it).
          # Late /d ×5 arrives: true /d total is 12 (the real leader),
          # but the sketch can only see the remainder's 5.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO funnel_access_summary
               (day, socket, status_class, request_count, unique_ips,
                top_paths, top_user_agents, computed_at)
             VALUES ((now() AT TIME ZONE 'UTC')::date - 40, 'funnel', '2xx', 34, 4,
                     '[{\"path\": \"/a\", \"count\": 10}, {\"path\": \"/b\", \"count\": 9}, {\"path\": \"/c\", \"count\": 8}]'::jsonb,
                     '[]'::jsonb, now() - interval '9 days');
             INSERT INTO funnel_access_log (ts, socket, status, path, user_agent)
             SELECT now() - interval '40 days', 'funnel', 200, '/d', 'sketch-pin'
             FROM generate_series(1, 5)" >/dev/null

          docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U openbrain_logs_rollup -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/summarize_funnel.sql >/dev/null

          verdict=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT request_count,
                    (SELECT string_agg(e->>'path', ',' ORDER BY (e->>'count')::bigint DESC)
                       FROM jsonb_array_elements(top_paths) AS e),
                    (SELECT COUNT(*) FROM funnel_access_log WHERE user_agent = 'sketch-pin')
             FROM funnel_access_summary
             WHERE day = (now() AT TIME ZONE 'UTC')::date - 40
               AND socket = 'funnel' AND status_class = '2xx'")
          test "$verdict" = "39|/a,/b,/c|0" || {
            echo "::error::top-N sketch pin drifted (count|tops|raw=$verdict, want 39|/a,/b,/c|0)"
            exit 1
          }
          echo "sketch pinned: request_count exact (34+5=39), below-3rd /d stays out of tops, raw retired"

      - name: Socket connections still require a password
        run: |
          set -euo pipefail
          # The image ships `local all all trust`. If --auth-local did not take,
          # every grant above is decorative because anything reaching the socket
          # could just connect as the superuser.
          ! docker exec -i -e PGPASSWORD=wrong sinkci \
            psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'select 1' 2>/dev/null \
            || { echo "superuser accepted a wrong password on the socket" >&2; exit 1; }
          echo "socket auth is scram, not trust"

      - name: Target-pinned wrapper runs the sink rollup
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/sink-summary-wrapper"
          report_dir="$smoke_root/reports"
          env_file="$smoke_root/funnel-summary.env"
          psql_shim="$smoke_root/psql"
          install -d -m 0700 "$smoke_root" "$report_dir"

          cat > "$psql_shim" <<'SH'
          #!/usr/bin/env bash
          test "${PGPASSWORD:-}" = ci_sink_rollup_pw || {
            echo "expected sink rollup password" >&2
            exit 40
          }
          if [[ -v OPENBRAIN_LOGS_ROLLUP_PASSWORD ]]; then
            echo "sink credential leaked under its source name" >&2
            exit 41
          fi
          exec docker exec -i -e PGPASSWORD sinkci psql "$@"
          SH
          chmod 0755 "$psql_shim"

          {
            printf 'SUMMARY_BACKEND=postgres\n'
            printf 'SUMMARY_TARGET=sink\n'
            printf 'DB_HOST=/var/run/postgresql\n'
            printf 'DB_PORT=5432\n'
            printf 'LOG_SINK_DB=%q\n' "$POSTGRES_DB"
            printf 'export OPENBRAIN_LOGS_ROLLUP_PASSWORD=%q\n' \
              "$OPENBRAIN_LOGS_ROLLUP_PASSWORD"
            printf 'SUMMARY_DIR=%q\n' "$report_dir"
            printf 'PSQL_BIN=%q\n' "$psql_shim"
          } > "$env_file"
          chmod 0600 "$env_file"

          FUNNEL_SUMMARY_ENV_FILE="$env_file" scripts/funnel_daily_summary.sh
          mapfile -t reports < <(
            find "$report_dir" -maxdepth 1 -type f \
              -name 'funnel-summary-*.md' -print
          )
          test "${#reports[@]}" -eq 1
          grep -F '# Funnel observability report' "${reports[0]}"
          ! grep -qF 'auth-failure reasons' "${reports[0]}" || {
            echo "sink target emitted the corpus auth-events section" >&2
            exit 1
          }

          # Retention finalized the original 40-day row into the summary and
          # deleted it; the recent row remains raw.
          q() {
            docker exec -i -e PGPASSWORD="$OPENBRAIN_LOGS_ROLLUP_PASSWORD" \
              sinkci psql -h /var/run/postgresql -U openbrain_logs_rollup \
              -d "$POSTGRES_DB" -Atc "$1"
          }
          test "$(q 'select count(*) from funnel_access_log where user_agent=$literal$ci$literal$;')" = 1
          test "$(q 'select count(*) from funnel_access_log where user_agent=$literal$ci$literal$ and ts < now() - interval $literal$30 days$literal$;')" = 0
          test "$(q 'select count(*) from funnel_access_summary;')" -ge 1
          echo "sink target selected only the sink role, socket, SQL, database, and report"

      - name: Assertion still passes after the rollup, and catches drift
        run: |
          set -euo pipefail
          A() { docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f - < db/log-sink/02-log-sink-assertion.sql; }
          S() { docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" sinkci psql -h /var/run/postgresql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "$1"; }
          A | grep -F 'invariants OK'
          # An assertion that never fires is worth nothing — prove each arm.
          S "grant select on funnel_access_summary to openbrain_monitor;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a widened grant" >&2; exit 1; }
          S "revoke select on funnel_access_summary from openbrain_monitor;" >/dev/null
          S "create table thoughts(id int);" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a stray relation" >&2; exit 1; }
          S "drop table thoughts;" >/dev/null
          S "grant select on funnel_access_log to public;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a GRANT to PUBLIC" >&2; exit 1; }
          S "revoke select on funnel_access_log from public;" >/dev/null
          S "create role intruder login;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a stray role" >&2; exit 1; }
          S "drop role intruder;" >/dev/null
          S "alter role openbrain_ingester nologin;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a disabled required role" >&2; exit 1; }
          S "alter role openbrain_ingester login;" >/dev/null
          S "alter role openbrain_ingester rename to ci_missing_ingester;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a missing required role" >&2; exit 1; }
          S "alter role ci_missing_ingester rename to openbrain_ingester;" >/dev/null
          S "grant pg_read_all_data to openbrain_ingester;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed an inherited (membership) privilege" >&2; exit 1; }
          S "revoke pg_read_all_data from openbrain_ingester;" >/dev/null
          S "grant insert on funnel_access_log to openbrain_ingester with grant option;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed WITH GRANT OPTION" >&2; exit 1; }
          S "revoke grant option for insert on funnel_access_log from openbrain_ingester;" >/dev/null
          S "grant select on funnel_access_log to pg_monitor;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a grant to a foreign grantee" >&2; exit 1; }
          S "revoke select on funnel_access_log from pg_monitor;" >/dev/null
          S "grant create on database $POSTGRES_DB to openbrain_monitor;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed database CREATE" >&2; exit 1; }
          S "revoke create on database $POSTGRES_DB from openbrain_monitor;" >/dev/null
          S "create function public.ci_probe() returns bigint language sql security definer as 'select count(*) from funnel_access_log';" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a SECURITY DEFINER routine" >&2; exit 1; }
          S "drop function public.ci_probe();" >/dev/null
          S "create schema ci_extra authorization openbrain_ingester;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a stray schema" >&2; exit 1; }
          S "drop schema ci_extra;" >/dev/null
          S "create function pg_catalog.ci_leak() returns bigint language sql security definer as 'select count(*) from funnel_access_log';" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a pg_catalog definer function" >&2; exit 1; }
          S "drop function pg_catalog.ci_leak();" >/dev/null
          S "create function information_schema.ci_leak() returns int language sql as 'select 1';" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed an information_schema routine" >&2; exit 1; }
          S "drop function information_schema.ci_leak();" >/dev/null
          S "create view information_schema.ci_leak_view as select 1 as x;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed an information_schema view" >&2; exit 1; }
          S "drop view information_schema.ci_leak_view;" >/dev/null
          # In-place catalog changes that KEEP the object's low OID (CREATE OR
          # REPLACE / ALTER), which the age test cannot see.
          S "alter function information_schema._pg_expandarray(anyarray) security definer;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed an existing routine flipped to SECURITY DEFINER" >&2; exit 1; }
          S "alter function information_schema._pg_expandarray(anyarray) security invoker;" >/dev/null
          S "create or replace view information_schema.information_schema_catalog_name as select (select count(*) from funnel_access_log)::text::information_schema.sql_identifier as catalog_name;" >/dev/null
          ! A 2>/dev/null || { echo "assertion missed a catalog view repointed at the sink tables" >&2; exit 1; }
          S "create or replace view information_schema.information_schema_catalog_name as select current_database()::information_schema.sql_identifier as catalog_name;" >/dev/null
          A | grep -F 'invariants OK'
          echo "assertion catches widened grants, grant options, memberships, missing/disabled/foreign roles, database CREATE, stray relations, stray schemas, stray routines (incl. system-schema definer functions and views), in-place SECURITY DEFINER flips, catalog views repointed at the sink tables, and PUBLIC"

      - name: Container logs on failure
        if: failure()
        run: docker logs sinkci || true
