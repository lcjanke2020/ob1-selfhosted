# Backup-recoverability smoke tests for the database init scripts and encrypted
# app-qube backup publisher.
#
# The off-box backup runs `pg_dump` as the trusted SELECT-only
# `openbrain_readonly` role (BYPASSRLS is required for pg_dump under forced
# RLS; the grants assertion rejects it on the app role). pg_dump reads every
# sequence's state (`SELECT last_value, is_called
# FROM <seq>`), so the role needs SELECT on all sequences, not just tables —
# a privilege that's easy to forget when a new serial/identity column lands.
# That is exactly what silently broke the nightly backup once the sessions PK
# became an identity column.
#
# The same completed init is also the integration fixture for the corpus
# breakout invariant. The assertion is mounted last, then deliberately re-run
# after sink-only roles, Funnel relations, and stale/unprovable pg_hba rules are
# introduced; each old-shape fixture must fail closed.
#
# Rather than enumerate privileges in a static assertion (which lags the next
# new object type, and can't see an object created later by a different
# superuser), this job exercises the REAL init path on a throwaway pgvector
# container — the same db/*.sql files, in the order the postgres entrypoint
# runs them — and then performs the actual operation the backup performs: a
# full `pg_dump -U openbrain_readonly`. If the read-only role can't dump any
# object, the job fails. This catches this class of regression generically.
#
# Scoped to db/**, the session-query production smokes and query path,
# deploy/compose-local/docker-compose.yml (the Postgres image pin it reads —
# see "Derive Postgres image" below), and this file — so it runs when the
# schema/grants, filtered-session search, the pinned image, or the test itself
# change.

name: DB init smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "db/**"
      - "server/session_queries.ts"
      - "server/queries.ts"
      - "server/metadata_notifications.ts"
      - "server/metadata_notifications_db_smoke.ts"
      - "server/access_tokens.ts"
      - "server/auth_context.ts"
      - "server/access_tokens_db_smoke.ts"
      - "server/auth_audit_db_smoke.ts"
      - "server/auth_audit_upgrade_db_smoke.ts"
      - "server/auth_middleware_audit_db_smoke.ts"
      - "server/auth.ts"
      - "server/inet.ts"
      - "server/db_boot_probe.ts"
      - "server/auth_audit.ts"
      - "server/session_search_db_smoke.ts"
      - "server/session_ordering_db_smoke.ts"
      - "server/thought_mutations_db_smoke.ts"
      - "server/scoped_db.ts"
      - "server/scope_contract.ts"
      - "server/db_pool.ts"
      - "server/embeddings.ts"
      - "server/config.ts"
      - "server/session_toml.ts"
      - "server/postgres_deferred_patched.ts"
      - "server/deno.json"
      - "server/deno.lock"
      - "deploy/compose-local/docker-compose.yml"
      - "deploy/compose-tailnet/docker-compose.pattern-b.yml"
      - "deploy/qubes/app-qube/backup/**"
      - "deploy/qubes/ingress-qube/docker-compose.yml"
      - "scripts/adopt-log-sink-marker.sh"
      - "scripts/funnel_daily_summary.sh"
      - "scripts/funnel_monitor.sh"
      - "scripts/funnel_monitor_test.sh"
      - "deploy/qubes/ingress-qube/funnel-monitor.env.example"
      - "deploy/qubes/ingress-qube/funnel-monitor.service"
      - "deploy/qubes/ingress-qube/funnel-monitor.timer"
      - "deploy/qubes/ingress-qube/funnel-summary.env.example"
      - "deploy/qubes/ingress-qube/funnel-summary.service"
      - "deploy/qubes/ingress-qube/funnel-summary.timer"
      - "deploy/qubes/app-qube/auth-events-summary.env.example"
      - "deploy/qubes/app-qube/auth-events-summary.service"
      - "deploy/qubes/app-qube/auth-events-summary.timer"
      - ".github/workflows/db-init.yml"
  push:
    branches: [main]
    paths:
      - "db/**"
      - "server/session_queries.ts"
      - "server/queries.ts"
      - "server/metadata_notifications.ts"
      - "server/metadata_notifications_db_smoke.ts"
      - "server/access_tokens.ts"
      - "server/auth_context.ts"
      - "server/access_tokens_db_smoke.ts"
      - "server/auth_audit_db_smoke.ts"
      - "server/auth_audit_upgrade_db_smoke.ts"
      - "server/auth_middleware_audit_db_smoke.ts"
      - "server/auth.ts"
      - "server/inet.ts"
      - "server/db_boot_probe.ts"
      - "server/auth_audit.ts"
      - "server/session_search_db_smoke.ts"
      - "server/session_ordering_db_smoke.ts"
      - "server/thought_mutations_db_smoke.ts"
      - "server/scoped_db.ts"
      - "server/scope_contract.ts"
      - "server/db_pool.ts"
      - "server/embeddings.ts"
      - "server/config.ts"
      - "server/session_toml.ts"
      - "server/postgres_deferred_patched.ts"
      - "server/deno.json"
      - "server/deno.lock"
      - "deploy/compose-local/docker-compose.yml"
      - "deploy/compose-tailnet/docker-compose.pattern-b.yml"
      - "deploy/qubes/app-qube/backup/**"
      - "deploy/qubes/ingress-qube/docker-compose.yml"
      - "scripts/adopt-log-sink-marker.sh"
      - "scripts/funnel_monitor.sh"
      - "scripts/funnel_monitor_test.sh"
      - "scripts/funnel_daily_summary.sh"
      - "deploy/qubes/ingress-qube/funnel-monitor.env.example"
      - "deploy/qubes/ingress-qube/funnel-monitor.service"
      - "deploy/qubes/ingress-qube/funnel-monitor.timer"
      - "deploy/qubes/ingress-qube/funnel-summary.env.example"
      - "deploy/qubes/ingress-qube/funnel-summary.service"
      - "deploy/qubes/ingress-qube/funnel-summary.timer"
      - "deploy/qubes/app-qube/auth-events-summary.env.example"
      - "deploy/qubes/app-qube/auth-events-summary.service"
      - "deploy/qubes/app-qube/auth-events-summary.timer"
      - ".github/workflows/db-init.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-pg-dump:
    name: readonly role can pg_dump
    runs-on: ubuntu-latest
    env:
      # PG_IMAGE is derived from compose at runtime (see the step below) so it
      # can't drift from the deployed stack's Postgres pin.
      POSTGRES_DB: openbrain
      POSTGRES_USER: postgres
      # CI-only throwaway credentials for an ephemeral container — not secrets.
      POSTGRES_PASSWORD: ci_superuser_pw
      OPENBRAIN_APP_PASSWORD: ci_app_pw
      OPENBRAIN_READONLY_PASSWORD: ci_readonly_pw
      # Dedicated create/list/revoke role for the native-token smoke.
      OPENBRAIN_TOKEN_ADMIN_PASSWORD: ci_token_admin_pw
    steps:
      # Same fork-safe ref pattern as ci.yml.
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Smoke test — funnel monitor cursor, dedupe, and secret handling
        run: bash scripts/funnel_monitor_test.sh

      - name: Smoke test — encrypted backups never clobber
        run: bash deploy/qubes/app-qube/backup/ob1-db-backup_test.sh

      - name: Derive Postgres image from compose-local (single source of truth)
        run: |
          # Read the pinned pgvector image from compose so this test always
          # exercises the same Postgres version the deployed stack uses — no
          # second pin to drift. `-m1` returns the first match (no `head`, so no
          # SIGPIPE), and `|| true` keeps a no-match from tripping
          # `set -eo pipefail` before the guard below can emit a clear error.
          img=$(grep -m1 -oE 'pgvector/pgvector:[A-Za-z0-9._-]+' deploy/compose-local/docker-compose.yml || true)
          test -n "$img" || { echo "::error::no pgvector image found in deploy/compose-local/docker-compose.yml"; exit 1; }
          echo "PG_IMAGE=$img" >> "$GITHUB_ENV"
          echo "Using $img (from deploy/compose-local/docker-compose.yml)"

      - name: Start Postgres + pgvector with the repo init scripts
        run: |
          # Mount the init files individually (not the whole db/ dir) so the
          # ops-only summarize_funnel.sql never runs as init — mirrors compose.
          docker run -d --name pgci \
            -p 127.0.0.1:55439:5432 \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            -e OPENBRAIN_APP_PASSWORD -e OPENBRAIN_READONLY_PASSWORD \
            -e OPENBRAIN_TOKEN_ADMIN_PASSWORD \
            -v "$GITHUB_WORKSPACE/db/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro" \
            -v "$GITHUB_WORKSPACE/db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/02-observability.sql:/docker-entrypoint-initdb.d/02-observability.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/04-sessions.sql:/docker-entrypoint-initdb.d/04-sessions.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/05-hybrid-search.sql:/docker-entrypoint-initdb.d/05-hybrid-search.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/06-spaces.sql:/docker-entrypoint-initdb.d/06-spaces.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/07-metadata-degradation.sql:/docker-entrypoint-initdb.d/07-metadata-degradation.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/08-access-tokens.sql:/docker-entrypoint-initdb.d/08-access-tokens.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/09-retire-corpus-funnel.sql:/docker-entrypoint-initdb.d/09-retire-corpus-funnel.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/10-thought-mutations.sql:/docker-entrypoint-initdb.d/10-thought-mutations.sql:ro" \
            -v "$GITHUB_WORKSPACE/db/03-grants-assertion.sql:/docker-entrypoint-initdb.d/99-grants-assertion.sql:ro" \
            "$PG_IMAGE"

      - name: Wait for init to finish (TCP ready == initdb.d complete)
        run: |
          # The entrypoint runs initdb.d against a local socket and only opens
          # TCP after every script succeeds, so TCP-ready doubles as "init
          # done". If an init script errors, the container exits — surface its
          # logs and fail loudly instead of timing out silently.
          for i in $(seq 1 60); do
            if docker exec pgci pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
              echo "postgres ready after ${i}s"; ready=1; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' pgci 2>/dev/null)" != "true" ]; then
              echo "::error::postgres container exited during init"; docker logs pgci; exit 1
            fi
            sleep 1
          done
          if [ "${ready:-}" != "1" ]; then
            echo "::error::timed out waiting for postgres init"; docker logs pgci; exit 1
          fi

      - name: Sanity-check init applied (sessions + spaces + audit present)
        run: |
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM information_schema.schemata WHERE schema_name='sessions'" | grep -q 1
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM memory_scope.workspace WHERE id='sensitive' AND personal_only" | grep -q 1
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT to_regclass('public.metadata_degradation_outbox') IS NOT NULL" | grep -q t
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM metadata_degradation_notification_state WHERE singleton" | grep -q 1
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT to_regclass('native_auth.access_token') IS NOT NULL" | grep -q t
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT COUNT(*) = 0 FROM pg_roles
             WHERE rolname IN (
               'openbrain_ingester',
               'openbrain_monitor',
               'openbrain_logs_rollup'
             )" | grep -q t
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -tAc \
            "SELECT to_regclass('public.funnel_access_log') IS NULL
                    AND to_regclass('public.funnel_access_summary') IS NULL" | grep -q t

      - name: Smoke test — native token lifecycle is hash-only and least-privilege
        run: |
          # Reapply the migration to pin the existing-database/idempotency path,
          # re-check catalog grants, then exercise register/list/revoke through
          # the real dedicated and application roles inside a rollback.
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/08-access-tokens.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/03-grants-assertion.sql >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/access-tokens-smoke.sql >/dev/null
          deno run --config server/deno.json --frozen \
            --allow-env \
            --allow-net=127.0.0.1:55439 \
            server/access_tokens_db_smoke.ts
          echo "native token registration, driver hashing, redacted listing, one-way revocation, and grants passed"

      - name: Smoke test — protected roles reject grant drift
        run: |
          run_assertion() {
            docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
              psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 < db/03-grants-assertion.sql
          }
          expect_rejected() {
            local label=$1
            local expected=$2
            local diagnostic=${3:-}
            local output
            if output=$(run_assertion 2>&1); then
              echo "::error::$label did not fail the protected-role grants assertion"
              return 1
            fi
            if ! grep -Fq "$expected" <<< "$output"; then
              echo "::error::$label failed without identifying $expected"
              echo "$output"
              return 1
            fi
            if [[ -n "$diagnostic" ]] && ! grep -Fq "$diagnostic" <<< "$output"; then
              echo "::error::$label failed without diagnostic marker $diagnostic"
              echo "$output"
              return 1
            fi
          }

          # The completed clean schema is valid, including relations created
          # after 02-observability.sql.
          run_assertion >/dev/null

          # HBA introspection is superuser-restricted. A lower-privilege caller
          # gets the documented diagnostic before any partial catalog check.
          set +e
          readonly_output=$(docker exec -i \
            -e PGPASSWORD="$OPENBRAIN_READONLY_PASSWORD" pgci \
            psql -h 127.0.0.1 -U openbrain_readonly -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -f - < db/03-grants-assertion.sql 2>&1)
          readonly_rc=$?
          set -e
          test "$readonly_rc" -ne 0
          grep -Fq 'grants assertion requires a database superuser' \
            <<< "$readonly_output"

          # An existing deployment may contain a pre-created or drifted role.
          # The migration must preserve LOGIN while removing every unsafe
          # cluster-level privilege flag, and the assertion must reject drift
          # before that reconciliation happens.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE openbrain_token_admin CREATEDB CREATEROLE REPLICATION"
          expect_rejected "token-admin privilege flags" \
            "openbrain_token_admin has unsafe cluster-level role attributes" \
            "CREATEDB, CREATEROLE, REPLICATION"
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/08-access-tokens.sql >/dev/null
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -tAc \
            "SELECT rolcanlogin AND NOT (
               rolsuper OR rolcreatedb OR rolcreaterole OR
               rolreplication OR rolbypassrls
             )
             FROM pg_roles WHERE rolname = 'openbrain_token_admin'" | grep -q t
          run_assertion >/dev/null

          # Direct flags are not the only way to reach BYPASSRLS: membership
          # would also confer inherited privileges and allow SET ROLE.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "GRANT openbrain_readonly TO openbrain_app"
          expect_rejected "app role membership" \
            "openbrain_app is a member of" "openbrain_readonly"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "REVOKE openbrain_readonly FROM openbrain_app"

          # PUBLIC default ACLs are delayed grants: no current table need expose
          # them, but the next migration would materialize the privilege.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "ALTER DEFAULT PRIVILEGES GRANT SELECT ON TABLES TO PUBLIC"
          expect_rejected "PUBLIC default table privileges" \
            "default privileges would grant future relations or sequences to PUBLIC" \
            "SELECT on future relations"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "ALTER DEFAULT PRIVILEGES REVOKE SELECT ON TABLES FROM PUBLIC"

          # The corpus must reject the retired role names even before a grant
          # is attached. The sink job separately proves these roles are valid
          # only inside the log-only cluster.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c "CREATE ROLE openbrain_monitor LOGIN"
          expect_rejected "retired monitor role" \
            "corpus contains sink-only role(s)" "openbrain_monitor"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c "DROP ROLE openbrain_monitor"

          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c "CREATE ROLE openbrain_ingester LOGIN"
          expect_rejected "retired ingester role" \
            "corpus contains sink-only role(s)" "openbrain_ingester"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c "DROP ROLE openbrain_ingester"

          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c "CREATE ROLE openbrain_logs_rollup LOGIN"
          expect_rejected "sink-only rollup role" \
            "corpus contains sink-only role(s)" "openbrain_logs_rollup"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c "DROP ROLE openbrain_logs_rollup"

          # A relation name is rejected independently of its shape, including
          # the BIGSERIAL sequence and indexes created by the historical DDL.
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE funnel_access_log (id BIGSERIAL PRIMARY KEY);
             CREATE TABLE funnel_access_summary (day date PRIMARY KEY)"
          expect_rejected "retired Funnel relations" \
            "corpus contains retired Funnel relation(s)" "funnel_access_log"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 -c \
            "DROP TABLE funnel_access_summary; DROP TABLE funnel_access_log"

          # A named HBA rule is drift even when its role does not exist. Use the
          # new rollup name to prove the complete sink-only census.
          hba_file=$(docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SHOW hba_file")
          docker exec pgci sh -c \
            'printf "%s\\n" "host all openbrain_logs_rollup 127.0.0.1/32 scram-sha-256" >> "$1"' \
            hba-append "$hba_file"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT pg_reload_conf()" | grep -q t
          expect_rejected "retired-role HBA rule" \
            "corpus pg_hba.conf names a retired sink-only role" "openbrain_logs_rollup"
          docker exec pgci sed -i '$d' "$hba_file"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT pg_reload_conf()" | grep -q t

          # Regex and @file tokens are interpreted by HBA at authentication
          # time but remain opaque to this catalog check. Reject rather than
          # pretending they exclude the retired identities.
          docker exec pgci sh -c \
            'printf "%s\\n" "host all \"/^openbrain_.*\" 127.0.0.1/32 scram-sha-256" >> "$1"' \
            hba-append "$hba_file"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT pg_reload_conf()" | grep -q t
          expect_rejected "regex HBA user token" \
            "unprovable regex/@file user token" "/^openbrain_"
          docker exec pgci sed -i '$d' "$hba_file"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT pg_reload_conf()" | grep -q t

          hba_role_file="${hba_file}.ci-sink-users"
          docker exec pgci sh -c \
            'printf "%s\\n" openbrain_logs_rollup > "$1"' \
            hba-users "$hba_role_file"
          docker exec pgci sh -c \
            'printf "host all @%s 127.0.0.1/32 scram-sha-256\\n" "$2" >> "$1"' \
            hba-append "$hba_file" "$hba_role_file"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT pg_reload_conf()" | grep -q t
          expect_rejected "@file HBA user token" \
            "corpus pg_hba.conf names a retired sink-only role"
          docker exec pgci sed -i '$d' "$hba_file"
          docker exec pgci rm -f "$hba_role_file"
          docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT pg_reload_conf()" | grep -q t

          run_assertion >/dev/null
          echo "protected-role assertions accepted the clean catalog and rejected role, relation, HBA, default-ACL, token-admin, and app-membership drift"

      - name: Smoke test — corpus retirement archives before restrictive drop
        run: |
          run_retirement() {
            docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
              psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 < db/09-retire-corpus-funnel.sql
          }
          super_sql() {
            docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
              psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 "$@"
          }

          super_sql -c \
            "CREATE ROLE openbrain_ingester LOGIN;
             CREATE ROLE openbrain_monitor LOGIN;
             CREATE ROLE openbrain_logs_rollup LOGIN;
             CREATE TABLE funnel_access_log (id BIGSERIAL PRIMARY KEY, marker text);
             CREATE TABLE funnel_access_summary (day date PRIMARY KEY);
             GRANT INSERT ON funnel_access_log TO openbrain_ingester;
             GRANT INSERT ON funnel_access_log TO openbrain_app;
             GRANT USAGE ON SEQUENCE funnel_access_log_id_seq TO openbrain_app;
             GRANT SELECT ON mcp_auth_events TO openbrain_monitor;
             INSERT INTO funnel_access_log (marker) VALUES ('must-archive');
             INSERT INTO funnel_access_summary (day) VALUES (current_date)" >/dev/null

          # Migration 09 carries the same conservative HBA proof as the final
          # assertion; pin its regex/@file arm independently before row checks.
          hba_file=$(super_sql -tAc "SHOW hba_file")
          docker exec pgci sh -c \
            'printf "%s\\n" "host all \"/^openbrain_.*\" 127.0.0.1/32 scram-sha-256" >> "$1"' \
            hba-append "$hba_file"
          super_sql -tAc "SELECT pg_reload_conf()" | grep -q t
          set +e
          retirement_output=$(run_retirement 2>&1)
          retirement_rc=$?
          set -e
          test "$retirement_rc" -ne 0
          grep -Fq 'unprovable regex/@file user token' <<< "$retirement_output"
          docker exec pgci sed -i '$d' "$hba_file"
          super_sql -tAc "SELECT pg_reload_conf()" | grep -q t

          set +e
          retirement_output=$(run_retirement 2>&1)
          retirement_rc=$?
          set -e
          test "$retirement_rc" -ne 0
          grep -Fq 'is nonempty' <<< "$retirement_output"
          grep -Fq 'funnel_access_log' <<< "$retirement_output"
          # The failed transaction must leave every legacy object intact.
          test "$(super_sql -tAc \
            "SELECT to_regclass('public.funnel_access_log') IS NOT NULL
                    AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname='openbrain_monitor')")" = t

          # CI's throwaway fixture stands in for the operator's verified
          # encrypted archive. Emptying only the raw table must not bypass the
          # independently nonempty frozen-summary guard (the live-fleet shape
          # Arc B is designed to retire).
          super_sql -c "TRUNCATE funnel_access_log" >/dev/null
          set +e
          retirement_output=$(run_retirement 2>&1)
          retirement_rc=$?
          set -e
          test "$retirement_rc" -ne 0
          grep -Fq 'funnel_access_summary' <<< "$retirement_output"

          # Only explicit emptying of both archived tables can open the row
          # guard. An archive-like third relation must still stop retirement
          # before either canonical table is dropped.
          super_sql -c "TRUNCATE funnel_access_summary" >/dev/null
          super_sql -c \
            "CREATE TABLE funnel_access_log_archive (marker text);
             INSERT INTO funnel_access_log_archive VALUES ('still-in-corpus')" >/dev/null
          set +e
          retirement_output=$(run_retirement 2>&1)
          retirement_rc=$?
          set -e
          test "$retirement_rc" -ne 0
          grep -Fq 'unexpected matching relation(s)' <<< "$retirement_output"
          grep -Fq 'funnel_access_log_archive' <<< "$retirement_output"
          test "$(super_sql -tAc \
            "SELECT to_regclass('public.funnel_access_log') IS NOT NULL
                    AND to_regclass('public.funnel_access_summary') IS NOT NULL")" = t
          super_sql -c "DROP TABLE funnel_access_log_archive" >/dev/null

          # An application writer that began before migration is deliberately
          # outside the edge-session census. Migration must wait for its row,
          # acquire ACCESS EXCLUSIVE, then observe and reject the committed row.
          writer_log="$RUNNER_TEMP/corpus-retirement-writer.log"
          (
            docker exec -e PGPASSWORD="$OPENBRAIN_APP_PASSWORD" pgci \
              psql -h 127.0.0.1 -U openbrain_app -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 -c \
              "BEGIN;
               INSERT INTO funnel_access_log (marker) VALUES ('concurrent-writer');
               SELECT pg_sleep(5) /* ci-retirement-writer */;
               COMMIT;"
          ) >"$writer_log" 2>&1 &
          writer_pid=$!
          writer_ready=
          for _ in $(seq 1 25); do
            if [[ "$(super_sql -tAc \
              "SELECT EXISTS (
                 SELECT 1 FROM pg_stat_activity
                 WHERE usename = 'openbrain_app'
                   AND query LIKE '%ci-retirement-writer%'
                   AND state = 'active'
               )")" = t ]]; then
              writer_ready=1
              break
            fi
            sleep 0.2
          done
          test "$writer_ready" = 1 || {
            echo "::error::concurrent retirement writer did not reach its hold point"
            cat "$writer_log"
            exit 1
          }

          set +e
          retirement_output=$(run_retirement 2>&1)
          retirement_rc=$?
          wait "$writer_pid"
          writer_rc=$?
          set -e
          test "$writer_rc" -eq 0 || { cat "$writer_log"; exit 1; }
          test "$retirement_rc" -ne 0
          grep -Fq 'funnel_access_log is nonempty' <<< "$retirement_output"
          test "$(super_sql -tAc \
            "SELECT count(*) FROM funnel_access_log WHERE marker='concurrent-writer'")" = 1

          super_sql -c "TRUNCATE funnel_access_log" >/dev/null
          run_retirement >/dev/null
          test "$(super_sql -tAc \
            "SELECT to_regclass('public.funnel_access_log') IS NULL
                    AND to_regclass('public.funnel_access_summary') IS NULL
                    AND NOT EXISTS (
                      SELECT 1 FROM pg_roles
                      WHERE rolname IN (
                        'openbrain_ingester',
                        'openbrain_monitor',
                        'openbrain_logs_rollup'
                      )
                    )")" = t
          # Already-retired reapplication is a no-op, and the final invariant
          # recognizes the converged state.
          run_retirement >/dev/null
          docker exec -i -e PGPASSWORD="$POSTGRES_PASSWORD" pgci \
            psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 < db/03-grants-assertion.sql >/dev/null
          echo "each nonempty table, an archive-like relation, and an in-flight writer blocked retirement; explicit emptying enabled an idempotent restrictive drop"

