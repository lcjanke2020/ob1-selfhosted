# Render the canonical deployment descriptors so the supported MCP environment,
# example files, and Pattern B sink boundary cannot silently drift.

name: Compose config

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "deploy/**"
      - "scripts/check_pattern_b_compose.nu"
      - "server/**"
      - ".github/workflows/compose-config.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "scripts/check_pattern_b_compose.nu"
      - "server/**"
      - ".github/workflows/compose-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-contract:
    name: Environment parity (${{ matrix.compose.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compose:
          - label: floor 2.38.2
            version: "2.38.2"
            sha256: 486b3ffc0f806ca2efbc430cef89955386011662f0c76bad17c103d059cfa9cf
          - label: current 5.3.1
            version: "5.3.1"
            sha256: f9ebc6ebdb19d769b793c245a736caaeb198c62587f13b25c660c13b4987f959
    steps:
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 1

      - name: Setup Nushell
        uses: hustcer/setup-nu@f3fd65374ffc4d60974c0dd2f7263c6c5c285f81 # v3
        with:
          version: "0.113.1"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Install pinned Docker Compose
        env:
          COMPOSE_SHA256: ${{ matrix.compose.sha256 }}
          COMPOSE_VERSION: ${{ matrix.compose.version }}
        run: |
          plugin_dir="${HOME}/.docker/cli-plugins"
          plugin_path="${plugin_dir}/docker-compose"
          mkdir -p "${plugin_dir}"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            --output "${plugin_path}"
          echo "${COMPOSE_SHA256}  ${plugin_path}" | sha256sum --check --strict
          chmod +x "${plugin_path}"
          test "$(docker compose version --short)" = "${COMPOSE_VERSION}"
          docker compose version

      - name: Verify rendered MCP environment parity
        working-directory: server
        run: deno task check-compose-env

      - name: Test Compose manifest and parity audits
        working-directory: server
        run: deno task test-compose-contract

      - name: Verify bounded launcher environments
        working-directory: server
        run: deno task check-allow-env

      - name: Verify Pattern B sink boundary
        run: nu scripts/check_pattern_b_compose.nu
