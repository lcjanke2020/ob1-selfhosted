# Render the canonical deployment descriptors so the supported MCP environment,
# example files, and Pattern B sink boundary cannot silently drift.

name: Compose config

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "deploy/compose-local/docker-compose.yml"
      - "deploy/compose-local/.env.example"
      - "deploy/compose-tailnet/docker-compose.pattern-b.yml"
      - "deploy/compose-tailnet/caddy/Dockerfile"
      - "deploy/qubes/docker-compose.external-db.yml"
      - "deploy/qubes/docker-compose.cpu-ollama.yml"
      - "deploy/qubes/app-qube/docker-compose.yml"
      - "deploy/qubes/app-qube/.env.example"
      - "deploy/qubes/ingress-qube/docker-compose.yml"
      - "deploy/qubes/ingress-qube/.env.example"
      - "scripts/check_pattern_b_compose.nu"
      - "server/**/*.ts"
      - "server/**/*.tsx"
      - "server/Dockerfile"
      - "server/Dockerfile.ingester"
      - "server/deno.json"
      - "server/scripts/deno.json"
      - "server/scripts/deno.lock"
      - ".github/workflows/compose-config.yml"
  push:
    branches: [main]
    paths:
      - "deploy/compose-local/docker-compose.yml"
      - "deploy/compose-local/.env.example"
      - "deploy/compose-tailnet/docker-compose.pattern-b.yml"
      - "deploy/compose-tailnet/caddy/Dockerfile"
      - "deploy/qubes/docker-compose.external-db.yml"
      - "deploy/qubes/docker-compose.cpu-ollama.yml"
      - "deploy/qubes/app-qube/docker-compose.yml"
      - "deploy/qubes/app-qube/.env.example"
      - "deploy/qubes/ingress-qube/docker-compose.yml"
      - "deploy/qubes/ingress-qube/.env.example"
      - "scripts/check_pattern_b_compose.nu"
      - "server/**/*.ts"
      - "server/**/*.tsx"
      - "server/Dockerfile"
      - "server/Dockerfile.ingester"
      - "server/deno.json"
      - "server/scripts/deno.json"
      - "server/scripts/deno.lock"
      - ".github/workflows/compose-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-contract:
    name: Environment parity and Pattern B boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head safely
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 1

      - name: Setup Nushell
        uses: hustcer/setup-nu@f3fd65374ffc4d60974c0dd2f7263c6c5c285f81 # v3
        with:
          version: "0.113.1"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Report Docker Compose version
        run: docker compose version

      - name: Verify rendered MCP environment parity
        working-directory: server
        run: deno task check-compose-env

      - name: Verify Pattern B sink boundary
        run: nu scripts/check_pattern_b_compose.nu
